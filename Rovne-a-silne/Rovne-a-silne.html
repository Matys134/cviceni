<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>Rovně a silně</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one narrow column built for a phone on the floor next to the mat. Navigation sits at the bottom within thumb reach;
   the workout is a list of collapsible exercise cards, plus a full-screen step-by-step mode with big buttons and a rest timer. */
:root {
  --bg: #EFF2F1;
  --surface: #FFFFFF;
  --panel: #E5EAE8;
  --ink: #131917;
  --muted: #59645F;
  --line: #D3DAD7;
  --accent: #0B7560;
  --accent-ink: #FFFFFF;
  --accent-soft: #D5ECE5;
  --weak: #A85F00;
  --weak-soft: #F5E5CC;
  --danger: #B3261E;
  --fig: #1E2724;
  --fig-far: #9AA6A1;
  --ghost: #D2D9D6;
  --floor: #AEB9B4;
  --prop: #7A8883;
  --prop-fill: #CDD5D2;
  --band: #0B7560;
  --mus: #E2572B;
  --shadow: rgba(19, 25, 23, .16);
  --fig-bg: #F6F8F7;
  --f-display: "Archivo", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
  --nav-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1312; --surface: #161D1B; --panel: #1C2523; --ink: #E5ECE9; --muted: #98A6A0;
    --line: #2A3532; --accent: #3CC7A2; --accent-ink: #052019; --accent-soft: #15342B;
    --weak: #F0A43C; --weak-soft: #3A2A12; --danger: #F2867E;
    --fig: #E5ECE9; --fig-far: #5E6B66; --ghost: #2A3532; --floor: #3B4743;
    --prop: #7E8C87; --prop-fill: #2B3633; --band: #3CC7A2; --mus: #FF8656; --shadow: rgba(0, 0, 0, .5); --fig-bg: #1F2927;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1312; --surface: #161D1B; --panel: #1C2523; --ink: #E5ECE9; --muted: #98A6A0;
  --line: #2A3532; --accent: #3CC7A2; --accent-ink: #052019; --accent-soft: #15342B;
  --weak: #F0A43C; --weak-soft: #3A2A12; --danger: #F2867E;
  --fig: #E5ECE9; --fig-far: #5E6B66; --ghost: #2A3532; --floor: #3B4743;
  --prop: #7E8C87; --prop-fill: #2B3633; --band: #3CC7A2; --mus: #FF8656; --shadow: rgba(0, 0, 0, .5); --fig-bg: #1F2927;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: max(14px, env(safe-area-inset-top)) calc(var(--nav-h) + 32px + env(safe-area-inset-bottom)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
.top h1 { font-size: 24px; font-weight: 800; font-stretch: 72%; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; }
.top h1 span { color: var(--accent); }
.phase { margin: 0; color: var(--muted); font-size: 14px; }
.phase b { color: var(--ink); font-family: var(--f-display); font-stretch: 80%; letter-spacing: 0.02em; }

/* Bottom navigation */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: flex; justify-content: center;
}
@supports (backdrop-filter: blur(1px)) { .nav { background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); } }
.nav-in { display: flex; width: 100%; max-width: 520px; }
.nav button {
  flex: 1 1 0; min-width: 0; border: 0; background: none; padding: 4px 0; min-height: 54px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .01em;
}
.nav .ico { width: 58px; height: 32px; border-radius: 99px; display: grid; place-items: center; transition: background-color .2s; }
.nav svg { width: 24px; height: 24px; }
.nav button[aria-selected="true"] { color: var(--ink); }
.nav button[aria-selected="true"] .ico { background: var(--accent-soft); color: var(--accent); }

section.view { padding-top: 16px; display: flex; flex-direction: column; gap: 20px; }

/* Hero: today's session */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.hero-top { display: flex; align-items: center; gap: 14px; }
.hero-top > div { flex: 1; min-width: 0; }
.kick { margin: 0 0 2px; font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.hero h2 { font-size: 32px; font-weight: 800; font-stretch: 72%; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1; }
.meta { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.ring { width: 76px; height: 76px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring .bg { stroke: var(--panel); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-stretch: 80%; font-size: 20px; }
.seg { display: flex; background: var(--panel); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 8px; border-radius: 9px; font-size: 14px; font-weight: 700; color: var(--muted); min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.seg button:disabled { cursor: not-allowed; opacity: .5; }
.bar { height: 8px; background: var(--panel); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.banner {
  background: var(--accent-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; font-size: 15px;
  display: flex; gap: 10px; align-items: center;
}
.banner svg { flex: none; width: 22px; height: 22px; color: var(--accent); }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 2px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; text-align: center;
}
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day.past:not(.today) { background: transparent; }
.dname { font-family: var(--f-display); font-weight: 700; font-stretch: 80%; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.1; }
.dnum { font-size: 11px; color: var(--muted); line-height: 1; }
.dplan { font-size: 10.5px; line-height: 1.1; color: var(--muted); min-height: 24px; display: flex; align-items: center; justify-content: center; hyphens: auto; padding: 0 1px; }
.chips { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; min-height: 24px; align-items: center; }
.chip {
  display: inline-grid; place-items: center; width: 21px; height: 21px; border-radius: 6px;
  background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 800; font-size: 12px;
}
.chip.s { background: var(--accent-soft); color: var(--accent); }
.walk {
  width: 100%; max-width: 40px; height: 32px; border-radius: 8px; border: 1px dashed var(--line); background: transparent;
  display: grid; place-items: center; color: var(--muted); padding: 0;
}
.walk svg { width: 16px; height: 16px; }
.walk[aria-pressed="true"] { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); }
.week-sum { margin: 8px 2px 0; font-size: 13px; color: var(--muted); }

/* Blocks */
.block { display: flex; flex-direction: column; gap: 10px; }
.block-head { display: flex; gap: 12px; align-items: baseline; }
.block-no { font-family: var(--f-display); font-weight: 800; font-stretch: 70%; font-size: 30px; line-height: 1; color: var(--accent); min-width: 20px; }
.block-head h2 { font-size: 21px; font-weight: 800; font-stretch: 80%; text-transform: uppercase; letter-spacing: 0.02em; }
.block-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

/* Figure */
.fig {
  background: radial-gradient(120% 100% at 50% 0%, var(--fig-bg) 0%, var(--panel) 75%);
  border-radius: 12px; aspect-ratio: 220 / 140; max-width: 100%; position: relative; overflow: hidden;
}
.fig svg { display: block; width: 100%; height: 100%; }
.fig .tag {
  position: absolute; left: 10px; top: 8px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  font-family: var(--f-display); font-weight: 700; font-stretch: 85%;
}
.fig .phd { position: absolute; right: 10px; top: 11px; display: flex; gap: 4px; }
.fig .phd i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: background-color .25s, transform .25s; }
.fig .phd i.on { background: var(--accent); transform: scale(1.25); }
.figbtn {
  position: absolute; right: 8px; bottom: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0;
  background: var(--surface); color: var(--ink); display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.18); opacity: .9;
}
.figbtn svg { width: 18px; height: 18px; }
.fig.paused .figbtn { background: var(--accent); color: var(--accent-ink); opacity: 1; }
.fig .mv polyline { animation: dash 1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -11; } }
.fig.paused .mv polyline { animation-play-state: paused; }
.figcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cap { margin: 0; font-size: 14px; line-height: 1.3; min-height: 2.6em; display: flex; gap: 8px; align-items: flex-start; }
.cap b {
  flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; margin-top: -1px;
  background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-size: 12px; font-weight: 800;
}
.mus-key { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin: 0; }
.mus-key i { width: 10px; height: 10px; border-radius: 50%; background: var(--mus); flex: none; }

/* Exercise card: collapsed = thumbnail row, open = big figure, logging and how-to */
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: border-color .2s; }
.ex.complete { border-color: var(--accent); }
.ex-top {
  display: grid; grid-template-columns: 96px minmax(0, 1fr) 30px; grid-template-areas: "fig tt chev";
  gap: 12px; align-items: center; padding: 8px 12px 8px 8px; cursor: pointer; user-select: none;
}
.ex-top .figcol { grid-area: fig; }
.ex-tt { grid-area: tt; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ex-tt h3 { font-size: 18px; font-weight: 750; font-stretch: 85%; line-height: 1.15; }
.rx { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 16px; font-stretch: 85%; color: var(--accent); }
.rx .side { font-family: var(--f-body); font-weight: 400; font-size: 13px; color: var(--muted); }
.chev { grid-area: chev; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); }
.chev::before { content: ''; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-2px) rotate(45deg); transition: transform .2s; }
.ex.open .chev::before { transform: translateY(2px) rotate(-135deg); }
.ex.complete .chev { background: var(--accent); }
.ex.complete .chev::before { width: 6px; height: 11px; border-color: var(--accent-ink); transform: translateY(-1px) rotate(45deg); }
.ex:not(.open) .ex-top .fig { border-radius: 9px; }
.ex:not(.open) .cap, .ex:not(.open) .figbtn, .ex:not(.open) .tag, .ex:not(.open) .phd, .ex:not(.open) .mus-key { display: none; }
.ex.open .ex-top { grid-template-columns: minmax(0, 1fr) 30px; grid-template-areas: "tt chev" "fig fig"; align-items: start; padding: 14px 14px 4px; }
@media (min-width: 700px) {
  .ex.open .ex-top { grid-template-columns: 300px minmax(0, 1fr) 30px; grid-template-areas: "fig tt chev"; }
}
.sdots { display: flex; gap: 4px; align-items: center; margin-top: 2px; }
.sdots i { width: 16px; height: 6px; border-radius: 99px; background: var(--panel); }
.sdots i.on { background: var(--accent); }
.sdots i.x { background: var(--weak-soft); }
.sdots i.x.on { background: var(--weak); }
.ex-more { display: none; padding: 6px 14px 16px; flex-direction: column; gap: 12px; }
.ex.open .ex-more { display: flex; }
.cues { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.cues li::marker { color: var(--accent); }
.how { border-top: 1px solid var(--line); padding-top: 10px; }
.how > summary { cursor: pointer; font-weight: 700; color: var(--accent); list-style: none; display: flex; align-items: center; gap: 6px; min-height: 32px; }
.how > summary::-webkit-details-marker { display: none; }
.how > summary::after { content: '▾'; font-size: 13px; }
.how[open] > summary::after { content: '▴'; }
.how > div { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.why { margin: 0; font-size: 15px; background: var(--accent-soft); border-radius: 10px; padding: 9px 11px; }
.why b { color: var(--accent); }
.err { margin: 0; font-size: 14px; color: var(--muted); }
.err strong { color: var(--danger); font-weight: 700; }
.weak-note { margin: 0; font-size: 14px; color: var(--weak); font-weight: 700; }
.goals { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0; font-size: 13px; color: var(--muted); }
.goal { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--panel); color: var(--ink); }
.goal.weak { background: var(--weak-soft); color: var(--weak); }
.goal-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }
.goal-list b { font-family: var(--f-display); font-stretch: 85%; }
.log { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pills .lbl { font-size: 13px; color: var(--muted); margin-right: 2px; }
.pill {
  min-width: 46px; height: 46px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface);
  font-family: var(--f-display); font-weight: 800; font-size: 17px; padding: 0 12px;
  transition: background-color .15s, border-color .15s, transform .1s;
}
.pill:active { transform: scale(.94); }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill.weak { border-color: var(--weak); color: var(--weak); font-size: 14px; font-stretch: 85%; }
.pill.weak[aria-pressed="true"] { background: var(--weak); color: var(--surface); }
.kg { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.kg input {
  width: 76px; height: 46px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface);
  padding: 0 8px; font-family: var(--f-display); font-weight: 700; font-size: 18px; color: var(--ink); text-align: center;
}
.btn {
  min-height: 44px; border-radius: 99px; border: 1.5px solid var(--ink); background: transparent; padding: 0 16px;
  font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
}
.btn svg { width: 18px; height: 18px; }
.btn.run { background: var(--ink); color: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); min-height: 52px; padding: 0 22px; font-size: 17px; }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.wide { width: 100%; border-radius: 14px; }
.btn.quiet { border-color: var(--line); color: var(--muted); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.badge { font-family: var(--f-body); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); vertical-align: middle; }
.up { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); }
.up input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }

.pair { display: flex; flex-direction: column; gap: 8px; border-left: 3px solid var(--accent); padding-left: 10px; }
.pair-h { margin: 0; font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }

/* Circuit */
.timer {
  background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 14px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center;
}
.timer .t-phase, .timer .t-name, .timer .t-next { grid-column: 1; }
.timer .t-phase { font-family: var(--f-display); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; font-size: 13px; opacity: .75; }
.timer .t-name { font-family: var(--f-display); font-weight: 800; font-stretch: 80%; font-size: 24px; line-height: 1.1; }
.timer .t-next { font-size: 14px; opacity: .75; }
.timer .t-clock { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 60px; line-height: 1; grid-column: 2; grid-row: 1 / span 3; }
.timer.rest .t-clock { color: var(--weak); }
.timer.work .t-clock { color: var(--accent); }
.timer .t-fig { grid-column: 1 / -1; }
.timer .t-fig .fig { --fig-bg: #2B3532; --panel: #222B29; --fig: #E5ECE9; --fig-far: #6B7874; --ghost: #33403C; --floor: #4A5652; --prop: #84928D; --prop-fill: #34403C; }
.timer .t-ctrl { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.timer .btn { border-color: var(--bg); color: var(--bg); }
.timer .btn.run { background: var(--bg); color: var(--ink); }
.timer .rounds { display: flex; gap: 6px; align-items: center; margin-left: auto; font-size: 13px; }
.timer .pill { height: 38px; min-width: 38px; background: transparent; color: var(--bg); border-color: rgba(255,255,255,.35); }
.timer .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mini { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mini.now { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mini h3 { font-size: 16px; font-weight: 750; font-stretch: 85%; line-height: 1.15; }
.mini p { margin: 0; font-size: 13px; color: var(--muted); }
.mini .fig { border-radius: 8px; }
.mini .figbtn { width: 30px; height: 30px; }
.mini .mini-why { color: var(--ink); border-top: 1px solid var(--line); padding-top: 6px; }
.bonus > summary { list-style: none; cursor: pointer; }
.bonus > summary::-webkit-details-marker { display: none; }
.bonus[open] > summary { margin-bottom: 10px; }
.bonus .tog {
  display: inline-block; vertical-align: middle; margin-left: 6px; padding: 2px 10px; border-radius: 99px; border: 1.5px solid var(--line);
  font-family: var(--f-body); font-size: 12px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--muted);
}
.bonus .tog::before { content: 'Zobrazit'; }
.bonus[open] .tog::before { content: 'Skrýt'; }
.bonus > div { display: flex; flex-direction: column; gap: 10px; }
.finish { display: flex; flex-direction: column; gap: 10px; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.finish .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.finish .row .btn.primary { flex: 1 1 200px; }

/* Step-by-step mode */
body.noscroll { overflow: hidden; }
.focus { position: fixed; inset: 0; z-index: 25; background: var(--bg); display: flex; flex-direction: column; }

const rad = a => a * Math.PI / 180;
const dirv = a => [Math.sin(rad(a)), Math.cos(rad(a))];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];

function ik(A, C, a, b, s) {
  const dx = C[0] - A[0], dy = C[1] - A[1];
  const d0 = Math.hypot(dx, dy) || 0.001;
  const ux = dx / d0, uy = dy / d0;
  const d = Math.min(Math.max(d0, Math.abs(a - b) + 0.5), a + b - 0.01);
  const al = Math.acos(Math.max(-1, Math.min(1, (a * a + d * d - b * b) / (2 * a * d))));
  const th = -s * al;
  const rx = ux * Math.cos(th) - uy * Math.sin(th), ry = ux * Math.sin(th) + uy * Math.cos(th);
  const B = [A[0] + a * rx, A[1] + a * ry];
  const ex = C[0] - B[0], ey = C[1] - B[1], e = Math.hypot(ex, ey) || 1;
  return [B, [B[0] + b * ex / e, B[1] + b * ey / e]];
}

function lerp(a, b, t) {

  if (Array.isArray(a) && Array.isArray(b)) return a.map((v, i) => v + (b[i] - v) * t);

}

const PREP = 3;

  const sec = +btn.dataset.sec, start = Date.now() + PREP * 1000, end = start + sec * 1000;
  let lastPrep = -1, started = false;
  btn.classList.add('run');
  const tick = () => {
    const now = Date.now();
    if (now < start) {
      const p = Math.ceil((start - now) / 1000);
      btn.textContent = `Připrav se… ${p}`;
      if (p !== lastPrep) { lastPrep = p; beep(520, 0.08, 0.1); }
      return;
    }
    if (!started) { started = true; beep(880, 0.3); }
    const left = Math.max(0, Math.ceil((end - now) / 1000));
    btn.textContent = `Zbývá 0:${pad(left)}`;
    if (left <= 0) {
      clearInterval(holdT.iv); beep(880, 0.5, 0.2);
      btn.textContent = 'Hotovo, další strana'; btn.classList.remove('run');

/* ---- circuit timer ---- */
// prepEnd: while set, the timer is in the get-ready countdown before (re)starting the current phase.
const CT = { running: false, phase: 'work', idx: 0, round: 0, left: WORK, endAt: 0, prepEnd: 0, iv: null, lastBeep: -1 };
function ctPaint() {
  const tm = document.getElementById('timer');
  if (!tm) return;
  const rt = cur.rt || roundsTarget();
  const e = EX[PLAN.circ[CT.idx]];
  const prep = CT.running && CT.prepEnd ? Math.max(1, Math.ceil((CT.prepEnd - Date.now()) / 1000)) : 0;
  const sec = prep || Math.max(0, Math.ceil(CT.left));
  tm.className = 'timer' + (prep ? ' rest' : CT.running || CT.started ? (CT.phase === 'work' ? ' work' : ' rest') : '');
  document.getElementById('t-clock').textContent = Math.floor(sec / 60) + ':' + pad(sec % 60);
  if (prep) {
    document.getElementById('t-phase').textContent = 'Připrav se';
    document.getElementById('t-name').textContent = (CT.phase === 'work' ? '' : 'Další: ') + e.name;
    document.getElementById('t-next').textContent = `Kolo ${CT.round + 1} z ${rt} · cvik ${CT.idx + 1} z 5`;
  } else if (CT.finished) {
    document.getElementById('t-phase').textContent = 'Hotovo';
    document.getElementById('t-name').textContent = 'Okruh dokončen';
    document.getElementById('t-next').textContent = `${rt} kola za tebou. Dokonči trénink dole.`;
  } else if (CT.phase === 'work') {
    document.getElementById('t-phase').textContent = CT.started ? (CT.running ? 'Cvič' : 'Pauza (zastaveno)') : 'Připraveno';
    document.getElementById('t-name').textContent = e.name;
    document.getElementById('t-next').textContent = `Kolo ${CT.round + 1} z ${rt} · cvik ${CT.idx + 1} z 5`;
  } else {
    document.getElementById('t-phase').textContent = CT.running ? 'Odpočinek' : 'Pauza (zastaveno)';
    document.getElementById('t-name').textContent = 'Další: ' + EX[PLAN.circ[CT.idx]].name;
    document.getElementById('t-next').textContent = `Kolo ${CT.round + 1} z ${rt}`;
  }
  // While the circuit runs, the current exercise is shown big inside the timer.
  const tf = document.getElementById('t-fig');
  if (tf) {
    const show = !!CT.started && !CT.finished;
    tf.hidden = !show;
    if (show && tf.dataset.i !== String(CT.idx)) {
      tf.dataset.i = CT.idx; tf.innerHTML = '<div class="fig"></div>';
      const cid = PLAN.circ[CT.idx]; mountFig(tf.firstChild, EX[cid].fig || cid);
    }
  }

}
function ctTick() {
  if (CT.prepEnd) {
    const p = Math.ceil((CT.prepEnd - Date.now()) / 1000);
    if (p > 0) {
      if (p !== CT.lastBeep) { CT.lastBeep = p; beep(520, 0.08, 0.1); }
      ctPaint(); return;
    }
    CT.prepEnd = 0; CT.lastBeep = -1;
    CT.endAt = Date.now() + CT.left * 1000;
    beep(880, 0.35);
  }
  CT.left = (CT.endAt - Date.now()) / 1000;
  const s = Math.ceil(CT.left);
  if (s <= 3 && s >= 1 && s !== CT.lastBeep) { CT.lastBeep = s; beep(520, 0.08, 0.1); }
  if (CT.left <= 0) {
    const rt = cur.rt || roundsTarget();
    if (CT.phase === 'work') {
      const lastOne = CT.idx === 4 && CT.round === rt - 1;
      if (lastOne) {
        CT.round++; finishRound(CT.round);
        CT.running = false; CT.finished = true; CT.left = 0; clearInterval(CT.iv); keepAwake(false);
        beep(880, 0.6, 0.2); ctPaint(); return;
      }
      CT.phase = 'rest'; CT.left = REST;
      if (CT.idx === 4) { CT.idx = 0; CT.round++; finishRound(CT.round); } else CT.idx++;
      beep(440, 0.35);
    } else {
      CT.phase = 'work'; CT.left = WORK; beep(880, 0.35);

    CT.endAt = Date.now() + CT.left * 1000; CT.lastBeep = -1;
  }

}
function finishRound(n) {

}

  if (CT.finished) resetCircuit();

  CT.running = true; CT.started = true;

}

const vToday = document.getElementById('v-today');

// Units are what you do in one go: a single exercise or a pair you alternate. Order: warm-up, strength, neck

const REST_MAIN = 75;
const FX = { open: false, u: 0, k: 0, rest: null, hold: null, iv: null, pushed: false, end: false, units: [] };
const focusEl = document.getElementById('focus');

function unitsOf(s) {
  const list = exList(s), out = [];

    for (let i = 0; i < ids.length; i++) {

      else out.push({ ids: [ids[i]], kind });

const unitDone = u => u.ids.every(id => exDone(cur, id));

const clock = sec => Math.floor(sec / 60) + ':' + pad(sec % 60);

function fxNext() {
  if (FX.u < FX.units.length - 1) { FX.u++; FX.k = firstOpenK(FX.units[FX.u]); }
  else if (nextOpenUnit(FX.u) < 0) FX.end = true;
  FX.hold = null; renderFocus();
}
function fxSaveKg(id) {
  const inp = document.getElementById('fx-kg');
  if (!inp || !EX[id].kg) return;
  const v = parseFloat(String(inp.value).replace(',', '.'));
  if (!isNaN(v) && v >= 0) cur.w[id] = Math.round(v * 10) / 10;
}

focusEl.addEventListener('click', ev => {
  const b = ev.target.closest('[data-fx]');
  if (!b || b.disabled) return;
  const a = b.dataset.fx, u = FX.units[FX.u], id = u && u.ids[FX.k];
  if (a === 'close') closeFocus();
  else if (a === 'done') fxDone();
  else if (a === 'next') fxNext();
  else if (a === 'prev') { if (FX.u > 0) { FX.u--; FX.k = firstOpenK(FX.units[FX.u]); FX.hold = null; renderFocus(); } }
  else if (a === 'k') { FX.k = +b.dataset.k; FX.hold = null; renderFocus(); }
  else if (a === 'undo') {
    if (cur.extra[id]) delete cur.extra[id]; else if (cur.sets[id]) cur.sets[id]--;
    touch(); renderFocus();
  } else if (a === 'kg') {
    const inp = document.getElementById('fx-kg');
    const v = parseFloat(String(inp.value).replace(',', '.'));
    const nv = Math.max(0, (isNaN(v) ? 0 : v) + +b.dataset.d);
    inp.value = fmtKg(nv); cur.w[id] = nv; touch();
  } else if (a === 'hold') {
    if (FX.hold) { FX.hold = null; paintHold(); return; }
    FX.hold = { id, sec: EX[id].hold, side: 1, prepEnd: Date.now() + PREP * 1000, endAt: 0, beep: -1 };
    paintHold(); runTicker(); fxTick();
  } else if (a === 'rest-add') { FX.rest.endAt += 15000; FX.rest.total += 15; fxTick(); }
  else if (a === 'rest-skip') { FX.rest = null; renderFocus(); }
  else if (a === 'neck') {
    const nk = b.dataset.ex;
    cur.sets[nk] = Math.min(EX[nk].sets, (cur.sets[nk] || 0) + 1); touch();
    renderFocus();
    toast(`${EX[nk].name}: série ${cur.sets[nk]} z ${EX[nk].sets}`);
  } else if (a === 'finish') { closeFocus(); finishSession(); }
  else if (a === 'bonus') {
    closeFocus();
    setTimeout(() => { const d = document.getElementById('bonus'); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }, 80);
  }
});
focusEl.addEventListener('change', ev => {
  if (ev.target.id !== 'fx-kg') return;
  const id = FX.units[FX.u].ids[FX.k];
  const v = parseFloat(String(ev.target.value).replace(',', '.'));
  if (isNaN(v) || v < 0) delete cur.w[id]; else cur.w[id] = Math.round(v * 10) / 10;
  touch();
});

/* ================= Overview ================= */
let delConfirm = null;
function renderLog() {
  const v = document.getElementById('v-log');
  const td = today(), mon = mondayOf(td);
  const done = state.sessions.filter(s => s.done);
  const thisWeek = done.filter(s => s.d >= mon && s.type !== 'S').length;
  let walksWeek = 0; for (let i = 0; i < 7; i++) if (state.walks[addDays(mon, i)]) walksWeek++;
  const tiles = `<div class="tiles">
    <div class="tile"><b class="num">${weekNo()}.</b><span>týden programu</span></div>
    <div class="tile"><b class="num">${thisWeek}/3</b><span>tréninky tento týden</span></div>
    <div class="tile"><b class="num">${walksWeek}/7</b><span>dny s chůzí tento týden</span></div>
    <div class="tile"><b class="num">${done.length}</b><span>dokončených tréninků celkem</span></div>
  </div>`;

  let cal = '<div class="cal"><span></span>' + DN.map(d => `<span class="h">${d}</span>`).join('');
  for (let w = 7; w >= 0; w--) {
    const m = addDays(mon, -7 * w);
    cal += `<span class="wl">${fmtShort(m)}</span>`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(m, i);
      const ss = done.filter(s => s.d === d);
      const main = ss.find(s => s.type !== 'S') || ss[0];
      const cls = ['c', main ? main.type : '', d > td ? 'fut' : '', d === td ? 'td' : ''].filter(Boolean).join(' ');
      const label = ss.map(s => s.type).join('');
      cal += `<span class="${cls}" title="${fmtDay(d)}${ss.length ? ': ' + ss.map(s => TYPE_NAME[s.type]).join(', ') : ''}${state.walks[d] ? ', chůze' : ''}">${label}${state.walks[d] ? '<i></i>' : ''}</span>`;
    }
  }
  cal += '</div>';

  const weighted = Object.keys(EX).filter(id => EX[id].kg && !EX[id].retired);
  const wRows = weighted.map(id => {
    const l = lastInfo(id);
    return `<tr><td>${EX[id].name}</td><td class="r num">${l ? fmtKg(l.kg) + ' kg' : '–'}</td><td class="num">${l ? fmtShort(l.d) : ''}</td><td>${l && l.up ? '<span class="badge">Přidej váhu</span>' : ''}</td></tr>`;
  }).join('');

  const list = [...state.sessions].sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : (b.u || 0) - (a.u || 0)).slice(0, 30);
  const rows = list.length ? list.map(s => {
    const p = prog(s);
    const conf = delConfirm === s.id;
    return `<div class="hrow"><span class="when">${fmtDay(s.d)}</span><span class="what">${TYPE_NAME[s.type]}${s.opt && s.rounds ? ' + okruh' : ''}${s.done ? '' : ' · rozdělaný'}</span><span class="pct">${p.pct} %</span>
      ${conf ? `<button class="btn danger" data-del-yes="${s.id}">Smazat</button><button class="btn quiet" data-del-no="1">Zpět</button>` : `<button class="btn quiet" data-del="${s.id}" aria-label="Smazat záznam ${fmtDay(s.d)}">Smazat</button>`}</div>`;
  }).join('') : '<p class="empty">Zatím tu nic není. Jakmile v záložce Trénink odškrtneš první sérii, trénink se tu objeví.</p>';

  const goals = `<details class="card"><summary><h2>Co plánem zlepšujeme</h2></summary>
      <ul class="goal-list">${Object.values(GOALS).map(g => `<li><span class="goal${g.weak ? ' weak' : ''}">${g.name}</span> ${g.what} <span class="note">Kde: ${g.where}.</span></li>`).join('')}</ul>
      <p class="note">U každého cviku v záložce Trénink je pod „Proč a na co si dát pozor“, který z cílů zlepšuje.</p>
    </details>`;
  const neck = `<details class="card"><summary><h2>Napřímená krční páteř</h2></summary>
      <p class="txt">Zdravý krk je při pohledu z boku mírně prohnutý dopředu (lordóza). Když je napřímený, hlava často ujíždí dopředu a šíjové svaly jsou přetížené a zároveň slabé. Plán proto posiluje hluboké ohybače krku (zásun brady) a šíjové svaly (tlak hlavy do dlaní), tedy dva cviky, které ve studiích zakřivení zlepšovaly nejvíc. Děláš je v pauzách silové části, takže nezaberou čas navíc. Výsledek se ve studiích ukázal až po 3 měsících pravidelného cvičení.</p>
      <p class="txt">Napřímený krk často vůbec nebolí a tvar na rentgenu sám o bolesti moc neříká. Když ti ho našel lékař, ukaž mu tyhle cviky, ať je případně upraví.</p>
      <p class="txt"><b>K lékaři nebo fyzioterapeutovi hned, když:</b></p>
      <ul class="list">
        <li>bolest, brnění nebo slabost vystřelují do ramene či ruky,</li>
        <li>se ti při cvičení točí hlava, rozmazává vidění nebo přijde silná bolest hlavy,</li>
        <li>krk začal bolet po úrazu (pád, autonehoda),</li>
        <li>se bolest po 2 týdnech cvičení zhoršuje.</li>
      </ul>
    </details>`;
  v.innerHTML = tiles + `
    <section class="card"><h2>Posledních 8 týdnů</h2>
      <div class="scroll">${cal}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Trénink A nebo B</span><span><i style="background:var(--accent-soft)"></i>Stabilizace a krk</span><span><i style="background:var(--weak);border-radius:50%"></i>Chůze</span></div>
    </section>
    <details class="card"><summary><h2>Rozvrh týdne</h2></summary>
      <div class="scroll"><table><thead><tr><th>Den</th><th>Plán</th></tr></thead><tbody>
        <tr><td>Pondělí</td><td>Trénink (A a B se střídají)</td></tr>
        <tr><td>Úterý</td><td>Chůze</td></tr>
        <tr><td>Středa</td><td>Trénink</td></tr>
        <tr><td>Čtvrtek</td><td>Chůze a krátká stabilizace</td></tr>
        <tr><td>Pátek</td><td>Trénink</td></tr>
        <tr><td>Sobota</td><td>Chůze</td></tr>
        <tr><td>Neděle</td><td>Volno</td></tr>
      </tbody></table></div>
      <p class="note">Dny si klidně posuň, jen mezi silovými tréninky nech aspoň den pauzu. Cíl pro chůzi: 8–10 tisíc kroků denně.</p>
    </details>
    <section class="card"><h2>Aktuální váhy</h2>
      <div class="scroll"><table><thead><tr><th>Cvik</th><th class="r">Naposledy</th><th>Kdy</th><th></th></tr></thead><tbody>${wRows}</tbody></table></div>
      <p class="note">Jakmile zvládneš všechny série o 2 opakování víc, přidej váhu a vrať se na původní počet opakování.</p>
    </section>
    <section class="card"><h2>Historie</h2><div class="hist">${rows}</div></section>` + goals + neck + backupHTML();
}

/* ---- backup: copy all records as text between devices ---- */
let backup = null, backupMsg = '';
function backupHTML() {
  const body = backup === 'export'
    ? `<textarea class="bk" id="bk-out" readonly rows="5" aria-label="Záloha záznamů">${esc(JSON.stringify(state))}</textarea>
      <div class="row"><button class="btn" data-bk="copy">Kopírovat</button>${APP ? '<button class="btn" data-bk="share">Sdílet</button>' : ''}<button class="btn quiet" data-bk="close">Zavřít</button></div>`
    : backup === 'import'
    ? `<textarea class="bk" id="bk-in" rows="5" placeholder="Sem vlož zkopírovanou zálohu" aria-label="Vložit zálohu"></textarea>
      <div class="row"><button class="btn" data-bk="load">Načíst zálohu</button><button class="btn quiet" data-bk="close">Zavřít</button></div>`
    : '<div class="row"><button class="btn" data-bk="export">Exportovat</button><button class="btn" data-bk="import">Importovat</button></div>';
  return `<section class="card"><h2>Záloha záznamů</h2>
      <p class="note">Přenese tréninky, váhy a chůzi mezi telefonem, počítačem a verzí na claude.ai. Na jednom zařízení dej Exportovat a zkopírovaný text vlož na druhém přes Importovat. Nic se nesmaže, záznamy se spojí.</p>
      ${body}${backupMsg ? `<p class="note" role="status">${backupMsg}</p>` : ''}
    </section>`;
}
function backupAction(act) {
  backupMsg = '';
  if (act === 'export' || act === 'import') backup = act;
  else if (act === 'close') backup = null;
  else if (act === 'copy') {
    const ta = document.getElementById('bk-out');
    ta.select();
    const done = () => { backupMsg = 'Zkopírováno. Teď to vlož na druhém zařízení přes Importovat.'; renderLog(); };
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) {} });
    else { try { document.execCommand('copy'); done(); } catch (e) {} }
    return;
  } else if (act === 'share') {
    try { APP.share(JSON.stringify(state)); } catch (e) {}
    return;
  } else if (act === 'load') {
    let o = null;
    try { o = JSON.parse(document.getElementById('bk-in').value.trim()); } catch (e) {}
    if (!o || o.v !== 1 || !Array.isArray(o.sessions)) { backupMsg = 'Tohle nevypadá jako záloha z této aplikace. Zkopíruj celý text z Exportovat.'; renderLog(); return; }
    const before = state.sessions.length;
    state = merge(o, state);
    save(); cur = null; backup = null;
    backupMsg = `Hotovo. Nových tréninků: ${state.sessions.length - before}.`;
    renderAll();
    return;
  }
  renderLog();
}
document.getElementById('v-log').addEventListener('click', ev => {
  const t = ev.target.closest('button');
  if (!t) return;
  if (t.dataset.bk) { backupAction(t.dataset.bk); return; }
  if (t.dataset.del) { delConfirm = t.dataset.del; renderLog(); }
  else if (t.dataset.delNo) { delConfirm = null; renderLog(); }
  else if (t.dataset.delYes) {
    const id = t.dataset.delYes;
    state.sessions = state.sessions.filter(s => s.id !== id);
    if (cur && cur.id === id) cur = null;
    if (!state.sessions.length) state.settings.start = null;
    delConfirm = null; save(); renderAll();
  }
});

const OFF_FIELDS = 'code,product_name,product_name_cs,brands,nutriments,serving_quantity,product_quantity';
const brandOf = x => (Array.isArray(x) ? x[0] || '' : String(x || '').split(',')[0]).trim();
function offToFood(h) {

  if (k == null && num(n.energy_100g) != null) k = num(n.energy_100g) / 4.184;
  const name = String(h.product_name_cs || h.product_name || '').trim();
  if (k == null || !h.code || !name) return null;
  const p = num(n.proteins_100g), c = num(n.carbohydrates_100g), fat = num(n.fat_100g), fib = num(n.fiber_100g) || 0;
  let warn = null;
  if (p == null) warn = 'Chybí údaj o bílkovinách.';
  else if (c != null && fat != null) {
    const est = 4 * p + 4 * c + 9 * fat + 2 * fib;
    if (Math.max(k, est) > 20 && Math.abs(k - est) / Math.max(k, est) > 0.25) warn = `Údaje si neodpovídají: kalorie ${Math.round(k)}, ze živin vychází ${Math.round(est)}. Zkontroluj obal.`;
  } else if (p * 4 > k * 1.1) warn = 'Bílkovin je víc, než dovolují kalorie. Zkontroluj obal.';

  const sq = num(h.serving_quantity), pq = num(h.product_quantity);
  if (sq > 0 && sq < 2000) por.push(['porce', Math.round(sq)]);
  if (pq > 0 && pq <= 3000 && Math.round(pq) !== Math.round(sq || 0)) por.push(['balení', Math.round(pq)]);
  return { id: 'off:' + h.code, src: 'off', code: String(h.code), n: name, b: brandOf(h.brands), k: Math.round(k), p: p == null ? 0 : Math.round(p * 10) / 10, por, warn };
}
async function offSearch(q, czOnly) {
  const qs = new URLSearchParams({ q: czOnly ? `${q} countries_tags:"en:czech-republic"` : q, page_size: '20', langs: 'cs,en', fields: OFF_FIELDS });
  const j = await getJSON('https://search.openfoodfacts.org/search?' + qs);

}
async function lookupCode(code) {
  const f = F();
  const own = Object.values(f.foods).find(x => x.src === 'own' && x.code === code && !x.del);
  if (own) return own;
  if (f.foods['off:' + code]) return f.foods['off:' + code];
  const j = await getJSON(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  if (j && j.status === 1 && j.product) {
    const x = offToFood(Object.assign({ code }, j.product));
    if (x) return x;
    return { missing: true, code, n: String(j.product.product_name_cs || j.product.product_name || '') };

}

/* ---- recents and local search ---- */
function recentFoods(mealId) {
  const f = F(), from = addDays(today(), -45), stats = new Map();
  for (const [d, es] of Object.entries(f.log)) {
    if (d < from) continue;
    for (const e of es) {
      if (e.del || !e.f) continue;
      const st = stats.get(e.f) || { id: e.f, n: 0, inMeal: 0, t: 0 };
      st.n++; if (e.m === mealId) st.inMeal++;
      st.t = Math.max(st.t, e.t || 0);
      stats.set(e.f, st);
    }
  }
  return [...stats.values()].filter(s => foodById(s.id))
    .sort((a, b) => (b.inMeal - a.inMeal) || (b.n - a.n) || (b.t - a.t));
}
function localSearch(q) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const used = new Map(recentFoods(null).map(s => [s.id, s.n]));
  const own = Object.values(F().foods).filter(x => !x.del);
  const ownCodes = new Set(own.filter(x => x.src === 'own' && x.code).map(x => x.code));
  const pool = [...own.filter(x => !(x.src === 'off' && ownCodes.has(x.code))), ...BASE.values()];
  const out = [];
  for (const x of pool) {
    const hay = norm(x.n + ' ' + (x.b || ''));
    if (!words.every(w => hay.includes(w))) continue;
    const starts = norm(x.n).startsWith(words[0]) ? 0 : 1;
    out.push({ x, score: starts * 10 - Math.min(used.get(x.id) || 0, 9) - (x.src === 'own' ? 2 : 0) });
  }
  return out.sort((a, b) => a.score - b.score || a.x.n.localeCompare(b.x.n, 'cs')).slice(0, 40).map(o => o.x);
}

const ACT = [[1.2, 'Sedavé (kancelář, skoro žádný pohyb)'], [1.375, 'Lehce aktivní (chůze, 1–3 tréninky týdně)'], [1.55, 'Aktivní (3–5 tréninků týdně, hodně chůze)'], [1.725, 'Velmi aktivní (fyzická práce nebo denní sport)']];

function calcGoals(pr) {
  // Mifflin–St Jeor; 7 700 kcal per kg of body fat. Protein 1,8 g/kg, at higher BMI counted from the weight at BMI 27.

const offMem = new Map();   // Open Food Facts results of this session, not saved until used
function resultsHTML() {
  const s = sheet, q = s.q.trim();
  if (!q) {
    const rec = recentFoods(s.meal).slice(0, 15).map(r => foodById(r.id));
    const favs = Object.entries(F().fav).filter(([id, v]) => v.on && foodById(id) && !rec.find(x => x.id === id)).map(([id]) => foodById(id));
    if (!rec.length && !favs.length) return '<p class="note">Napiš, co jíš, nebo naskenuj čárový kód. Co jednou přidáš, objeví se tady a příště to přidáš jedním klepnutím na +.</p>';
    return (rec.length ? `<h3 class="fh3">Naposledy</h3>${rec.map(x => resRow(x, true)).join('')}` : '')
      + (favs.length ? `<h3 class="fh3">Oblíbené</h3>${favs.map(x => resRow(x, true)).join('')}` : '');
  }
  let html = '';
  if (/^\d{8,14}$/.test(q)) html += `<button class="btn" data-sh="code">Najít čárový kód ${esc(q)}</button>`;
  const loc = localSearch(q);
  html += loc.length ? loc.map(x => resRow(x, true)).join('') : '';
  const o = s.off;
  if (o && o.q === q) {
    const seen = new Set(loc.map(x => x.code).filter(Boolean));
    const hits = (o.results || []).filter(x => !seen.has(x.code) && !F().foods[x.id]);
    html += `<h3 class="fh3">Open Food Facts</h3>`;
    if (o.loading) html += '<p class="note">Hledám v Open Food Facts…</p>';
    else if (o.error) html += `<p class="note">${APP ? 'Open Food Facts teď neodpovídá. Jsi připojený k internetu?' : 'Vyhledávání v Open Food Facts funguje v aplikaci v telefonu. Tady najdeš základní a vlastní potraviny, nebo zadej čárový kód.'}</p>`;
    else if (!hits.length) html += '<p class="note">Nic dalšího. Zkus jiné slovo, naskenuj kód, nebo si potravinu založ přes Nová potravina.</p>';
    else html += hits.map(x => { offMem.set(x.id, x); return resRow(x, false); }).join('');
  } else if (!loc.length) html += '<p class="note">Nic nenalezeno.</p>';
  return html;
}
function updateResults() { const r = document.getElementById('sh-res'); if (r && sheet && sheet.mode === 'search') r.innerHTML = resultsHTML(); }
function scheduleOff(q) {
  clearTimeout(offTimer);
  q = q.trim();
  if (q.length < 3 || /^\d+$/.test(q)) { sheet.off = null; return; }
  sheet.off = { q, loading: true };
  offTimer = setTimeout(async () => {
    const seq = ++offSeq;
    let res = null, err = false;
    try {
      res = await offSearch(q, true);
      if (res.length < 6) { const more = await offSearch(q, false); const ids = new Set(res.map(x => x.id)); res = res.concat(more.filter(x => !ids.has(x.id))); }
    } catch (e) { err = true; }
    if (seq !== offSeq || !sheet || sheet.mode !== 'search' || sheet.q.trim() !== q) return;
    sheet.off = err ? { q, error: true } : { q, results: res };
    updateResults();
  }, 450);
}

/* amount panel */
function amountHTML() {
  const s = sheet, x = s.food;
  if (!x) { // quick entry being edited: only kcal and protein
    const e = dayLog(foodDay || today()).find(y => y.id === s.entryId);
    return `<div class="sh-form"><label>Kalorie <input id="qk" inputmode="numeric" value="${Math.round(e.K)}"></label>
      <label>Bílkoviny <input id="qp" inputmode="decimal" value="${fmt1(e.P)}"></label>
      <label class="wide">Název <input id="qn" value="${esc(e.n)}"></label>
      <div class="row wide"><button class="btn primary" data-sh="quick-save">Uložit</button><button class="btn danger" data-sh="del">Smazat</button></div></div>`;
  }
  const units = portionsOf(x).map(([n, gr]) => `<button class="chip-u" data-sh="unit" data-un="${esc(n)}" aria-pressed="${s.un === n}">${n === 'g' ? 'gramy' : `${esc(n)} <small>${fmtN(gr)} g</small>`}</button>`).join('');
  const edit = s.mode === 'entry';
  return `<div class="amt">
    <h3>${esc(x.n)}</h3>
    <p class="note">${esc(srcLabel(x))}${x.code ? ` · kód ${esc(x.code)}` : ''}</p>
    ${x.warn ? `<p class="fwarn">⚠ ${esc(x.warn)}</p>` : ''}
    <div class="amt-row"><input id="sh-amt" inputmode="decimal" value="${s.qty != null ? fmt1(s.qty) : ''}" aria-label="Množství"><span class="amt-un">${s.un === 'g' ? 'g' : esc(s.un)}</span></div>
    <div class="units">${units}</div>
    <p class="amt-prev num" id="sh-prev"></p>
    <div class="row">
      <button class="btn primary" data-sh="${edit ? 'save' : 'add'}">${edit ? 'Uložit' : 'Přidat'}</button>
      ${x.src !== 'quick' ? `<button class="btn" data-sh="fav" aria-pressed="${isFav(x.id)}">${isFav(x.id) ? '★ Oblíbená' : '☆ Do oblíbených'}</button>` : ''}
      ${edit ? '<button class="btn danger" data-sh="del">Smazat</button>' : '<button class="btn quiet" data-sh="back">Zpět</button>'}
    </div>
    <p class="note">Na 100 g: ${fmtN(x.k)} kcal · ${fmt1(x.p)} g bílkovin. <button class="link" data-sh="fix">${x.src === 'own' ? 'Upravit potravinu' : 'Opravit hodnoty'}</button></p>
  </div>`;
}
function amountNow() {
  const s = sheet, q = num(document.getElementById('sh-amt').value);
  if (!q || q <= 0) return null;
  const g = gramsOf(s.food, s.un, q);
  return { q, g, K: s.food.k * g / 100, P: s.food.p * g / 100 };
}
function updateAmountPreview() {
  const a = amountNow(), el = document.getElementById('sh-prev');
  el.textContent = a ? `= ${fmtN(a.K)} kcal · ${fmt1(a.P)} g bílkovin${sheet.un !== 'g' ? ` (${fmtN(a.g)} g)` : ''}` : 'Zadej množství';
  // Typing grams while a portion is selected is the easiest mistake to make; flag it.
  if (a && sheet.un !== 'g' && a.q >= 20) el.textContent += ` · Opravdu ${fmt1(a.q)}× ${sheet.un}? Pro gramy vyber „gramy“.`;
}
function pickFood(x) {
  const last = F().last[x.id];
  const okUnit = un => portionsOf(x).some(p => p[0] === un);
  let un = 'g', qty = 100;
  if (last && okUnit(last.un)) { un = last.un; qty = last.q; }
  else if ((x.por || []).length) { un = x.por[0][0]; qty = 1; }
  sheet = Object.assign(sheet, { mode: 'amount', food: x, un, qty });
  renderSheet();
}
function storeFood(x) {
  // Open Food Facts items are cached once used, so they work offline and show up in search and recents.
  const f = F();
  if ((x.src === 'off' || x.src === 'own') && !f.foods[x.id]) f.foods[x.id] = Object.assign({}, x, { ts: Date.now() });
}
function addEntry(x, a, un) {
  const f = F(), d = foodDay || today(), now = Date.now();
  storeFood(x);
  const e = { id: sid(), f: x.id, n: x.n, g: Math.round(a.g * 10) / 10, un, q: a.q, k: x.k, p: x.p, K: a.K, P: a.P, m: sheet.meal, t: now, ts: now };
  (f.log[d] = f.log[d] || []).push(e);
  f.last[x.id] = { un, q: a.q, ts: now };
  save();
  toast(`Přidáno: ${x.n}`, () => { e.del = true; e.ts = Date.now(); save(); if (sheet) renderSheet(); else renderFood(); });
}

/* own food editor (new, fixing Open Food Facts / base values, editing own) */
function foodFormHTML() {
  const s = sheet, x = s.edit || {};
  const por = (x.por || []).concat([['', ''], ['', ''], ['', '']]).slice(0, 3);
  return `<div class="sh-form">
    ${s.msg ? `<p class="fwarn wide">${esc(s.msg)}</p>` : ''}
    <label class="wide">Název <input id="ff-n" value="${esc(x.n || '')}" placeholder="např. Tvaroh polotučný Madeta"></label>
    <label class="wide">Značka (nepovinné) <input id="ff-b" value="${esc(x.b || '')}"></label>
    <label>Kalorie na 100 g <input id="ff-k" inputmode="decimal" value="${x.k != null ? x.k : ''}"></label>
    <label>Bílkoviny na 100 g <input id="ff-p" inputmode="decimal" value="${x.p != null ? fmt1(x.p) : ''}"></label>
    <label class="wide">Čárový kód (nepovinné) <input id="ff-c" inputmode="numeric" value="${esc(x.code || '')}"></label>
    <p class="note wide">Porce, které chceš vybírat místo gramů (třeba „kelímek 250“ nebo „ks 55“):</p>
    ${por.map((p, i) => `<label>Porce <input id="ff-pn${i}" value="${esc(p[0])}" placeholder="název"></label><label>Gramů <input id="ff-pg${i}" inputmode="decimal" value="${p[1]}"></label>`).join('')}
    <div class="row wide"><button class="btn primary" data-sh="food-save">Uložit</button>
      ${x.src === 'own' && x.id ? '<button class="btn danger" data-sh="food-del">Smazat potravinu</button>' : ''}
      <button class="btn quiet" data-sh="back">Zpět</button></div>
  </div>`;
}
function saveFoodForm() {
  const val = id => document.getElementById(id).value.trim();
  const n = val('ff-n'), k = num(val('ff-k')), p = num(val('ff-p')), code = val('ff-c').replace(/\D/g, '');
  if (!n || k == null || k < 0 || p == null || p < 0) { toast('Vyplň název, kalorie a bílkoviny.'); return null; }
  const por = [];
  for (let i = 0; i < 3; i++) { const pn = val('ff-pn' + i), pg = num(val('ff-pg' + i)); if (pn && pg > 0 && pn !== 'g') por.push([pn, pg]); }
  const f = F(), prev = sheet.edit;
  // Editing an own food keeps its id; fixing a base / Open Food Facts item creates an own copy that wins in search.
  let id = prev && prev.src === 'own' && prev.id ? prev.id : null;
  if (!id && code) { const same = Object.values(f.foods).find(x => x.src === 'own' && x.code === code && !x.del); if (same) id = same.id; }
  if (!id) id = 'own:' + sid();
  const x = { id, src: 'own', n, b: val('ff-b'), k: Math.round(k), p: Math.round(p * 10) / 10, por, code: code || '', ts: Date.now() };
  f.foods[id] = x;
  if (prev && prev.id && prev.id !== id && isFav(prev.id)) f.fav[id] = { on: true, ts: Date.now() };
  save();
  return x;
}

/* sheet events */
sheetEl.addEventListener('input', ev => {
  if (!sheet) return;
  if (ev.target.id === 'sh-q') { sheet.q = ev.target.value; scheduleOff(sheet.q); updateResults(); }
  else if (ev.target.id === 'sh-amt') updateAmountPreview();
});
sheetEl.addEventListener('change', ev => {
  if (ev.target.dataset.sh === 'meal') sheet.meal = ev.target.value;
});
sheetEl.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || !sheet) return;
  if (ev.target.id === 'sh-amt') { ev.preventDefault(); sheetEl.querySelector('[data-sh="add"],[data-sh="save"]').click(); }
  else if (ev.target.id === 'sh-q') { ev.target.blur(); }
});
sheetEl.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-sh]');
  if (!b || !sheet || b.tagName === 'SELECT') return;
  const a = b.dataset.sh, s = sheet, f = F(), d = foodDay || today();
  if (a === 'close') closeSheet();
  else if (a === 'back') {
    if (s.from === 'settings') closeSheet();
    else if (s.mode === 'food' && s.back) { Object.assign(s, { mode: s.back, back: null, edit: null, msg: null }); renderSheet(); }
    else { Object.assign(s, { mode: 'search', food: null, edit: null, msg: null }); renderSheet(); }
  }
  else if (a === 'pick') { const x = foodById(b.dataset.id) || offMem.get(b.dataset.id); if (x) pickFood(x); }
  else if (a === 'qadd') {
    const x = foodById(b.dataset.id), last = f.last[b.dataset.id];
    if (!x || !last) return;
    const g = gramsOf(x, last.un, last.q);
    addEntry(x, { q: last.q, g, K: x.k * g / 100, P: x.p * g / 100 }, last.un);
    b.classList.add('done'); setTimeout(() => b.classList.remove('done'), 900);
  } else if (a === 'unit') {
    const cur = amountNow();
    s.un = b.dataset.un;
    s.qty = s.un === 'g' ? (cur ? Math.round(cur.g) : 100) : 1;
    renderSheet();
  } else if (a === 'add') {
    const am = amountNow(); if (!am) return;
    addEntry(s.food, am, s.un);
    Object.assign(s, { mode: 'search', q: '', food: null, off: null });
    renderSheet();
  } else if (a === 'save') {
    const am = amountNow(), e = (f.log[d] || []).find(y => y.id === s.entryId);
    if (!am || !e) return;
    Object.assign(e, { g: Math.round(am.g * 10) / 10, un: s.un, q: am.q, K: am.K, P: am.P, m: s.meal, ts: Date.now() });
    if (e.f) f.last[e.f] = { un: s.un, q: am.q, ts: Date.now() };
    save(); closeSheet();
  } else if (a === 'del') {
    const e = (f.log[d] || []).find(y => y.id === s.entryId);
    if (!e) return;
    e.del = true; e.ts = Date.now(); save(); closeSheet();
    toast(`Smazáno: ${e.n}`, () => { e.del = false; e.ts = Date.now(); save(); renderFood(); });
  } else if (a === 'fav') {
    const id = s.food.id;
    storeFood(s.food);
    f.fav[id] = { on: !isFav(id), ts: Date.now() }; save(); renderSheet();
  } else if (a === 'quick') { s.mode = 'quick'; renderSheet(); document.getElementById('qk').focus(); }
  else if (a === 'quick-add' || a === 'quick-save') {
    const K = num(document.getElementById('qk').value), P = num(document.getElementById('qp').value) || 0;
    if (!K || K <= 0) { toast('Zadej kalorie.'); return; }
    const n = document.getElementById('qn').value.trim() || 'Rychlé přidání', now = Date.now();
    if (a === 'quick-save') {
      const e = (f.log[d] || []).find(y => y.id === s.entryId);
      Object.assign(e, { n, K, P, m: s.meal, ts: now }); save(); closeSheet(); return;
    }
    const e = { id: sid(), f: null, n, g: null, K, P, m: s.meal, t: now, ts: now };
    (f.log[d] = f.log[d] || []).push(e); save();
    toast(`Přidáno: ${n}`, () => { e.del = true; e.ts = Date.now(); save(); renderFood(); });
    Object.assign(s, { mode: 'search', q: '' }); renderSheet();
  } else if (a === 'new') { Object.assign(s, { mode: 'food', edit: { n: s.q && !/^\d+$/.test(s.q) ? s.q : '', code: /^\d{8,14}$/.test(s.q.trim()) ? s.q.trim() : '' }, msg: null }); renderSheet(); }
  else if (a === 'fix') { Object.assign(s, { mode: 'food', edit: Object.assign({}, s.food), msg: s.food.src === 'own' ? null : 'Uloží se jako tvoje vlastní potravina a v hledání bude mít přednost.', back: s.mode }); renderSheet(); }
  else if (a === 'food-save') {
    const x = saveFoodForm(); if (!x) return;
    if (s.from === 'settings') { closeSheet(); return; }
    if (s.entryId) { // fixing values of an entry being edited: keep editing it with the new food
      const e = (f.log[d] || []).find(y => y.id === s.entryId);
      if (e) { e.f = x.id; e.n = x.n; e.k = x.k; e.p = x.p; e.ts = Date.now(); }
      Object.assign(s, { mode: 'entry', food: x, un: 'g', qty: e ? e.g : 100, edit: null }); renderSheet(); return;
    }
    s.edit = null; pickFood(x);
  } else if (a === 'food-del') {
    const x = f.foods[s.edit.id];
    if (x) { x.del = true; x.ts = Date.now(); save(); }
    if (s.from === 'settings') closeSheet(); else { Object.assign(s, { mode: 'search', edit: null }); renderSheet(); }
  } else if (a === 'scan' || a === 'code') {
    let code = s.q.trim();
    if (a === 'scan') {
      const [c, err] = await nativeCall('scanBarcode');
      if (!c) { if (err) toast(err); return; }
      code = String(c).replace(/\D/g, '');
    }
    if (!sheet) return;
    Object.assign(sheet, { mode: 'loading', msg: `Hledám kód ${code}…` }); renderSheet();
    try {
      const x = await lookupCode(code);
      if (!sheet) return;
      if (x.missing) { Object.assign(sheet, { mode: 'food', edit: { n: x.n, code }, msg: 'Open Food Facts tenhle kód nezná nebo u něj chybí výživové hodnoty. Opiš je z obalu, příště se načte sám.' }); renderSheet(); }
      else { sheet.mode = 'search'; pickFood(x); }
    } catch (e) {
      if (!sheet) return;
      Object.assign(sheet, { mode: 'food', edit: { code }, msg: 'Nepodařilo se spojit s Open Food Facts. Hodnoty můžeš opsat z obalu.' }); renderSheet();
    }
  }
});

/* ---- toast with undo ---- */
let toastT = null;
function toast(msg, undo) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button class="link" data-undo="1">Zpět</button>' : ''}`;
  t.hidden = false;
  t.onclick = ev => { if (ev.target.dataset.undo) { undo(); t.hidden = true; } };
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, undo ? 5000 : 3500);
}

/* ================= Tabs ================= */
const TABS = ['today', 'food', 'log', 'weak'];
function showTab(t) {
  for (const k of TABS) {
    document.getElementById('v-' + k).hidden = k !== t;
    document.getElementById('tab-' + k).setAttribute('aria-selected', String(k === t));
  }
  try { localStorage.setItem(LS_KEY + '-tab', t); } catch (e) {}
}
document.querySelector('.tabs').addEventListener('click', ev => {
  const b = ev.target.closest('[data-tab]');
  if (b) { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }
});

function renderAll() { renderHeader(); renderToday(); renderFood(); renderLog(); renderWeak(); }

let startTab = 'today';
try { const t = localStorage.getItem(LS_KEY + '-tab'); if (TABS.includes(t)) startTab = t; } catch (e) {}
const hashTab = (location.hash || '').slice(1);
if (TABS.includes(hashTab)) startTab = hashTab;
renderAll();
showTab(startTab);
connect();
if (APP) {
  setMode('local');
  const v = document.createElement('span');
  v.innerHTML = `· Verze ${esc(APP.version())} · <button class="link" id="upd">Zkontrolovat aktualizace</button>`;
  document.getElementById('store').appendChild(v);
  document.getElementById('upd').addEventListener('click', () => APP.checkUpdate());
}

// Refresh "today" when the date rolls over while the page stays open.
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!CT.running) { cur = null; renderAll(); } } }, 60000);
})();
</script>
