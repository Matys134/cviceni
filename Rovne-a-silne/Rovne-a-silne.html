<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>Rovně a silně</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one narrow column built for a phone on the floor next to the mat — week strip, then the workout as a stack of exercise cards with a live figure on each. */
:root {
  --bg: #EFF2F1;
  --surface: #FFFFFF;
  --panel: #E5EAE8;
  --ink: #131917;
  --muted: #59645F;
  --line: #D3DAD7;
  --accent: #0B7560;
  --accent-ink: #FFFFFF;
  --accent-soft: #D5ECE5;
  --weak: #A85F00;
  --weak-soft: #F5E5CC;
  --danger: #B3261E;
  --fig: #131917;
  --fig-far: #97A39E;
  --ghost: #C3CCC8;
  --floor: #AEB9B4;
  --prop: #7A8883;
  --prop-fill: #CDD5D2;
  --band: #0B7560;
  --f-display: "Archivo", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1312; --surface: #161D1B; --panel: #1C2523; --ink: #E5ECE9; --muted: #98A6A0;
    --line: #2A3532; --accent: #3CC7A2; --accent-ink: #052019; --accent-soft: #15342B;
    --weak: #F0A43C; --weak-soft: #3A2A12; --danger: #F2867E;
    --fig: #E5ECE9; --fig-far: #5A6762; --ghost: #33403C; --floor: #3B4743;
    --prop: #7E8C87; --prop-fill: #2B3633; --band: #3CC7A2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1312; --surface: #161D1B; --panel: #1C2523; --ink: #E5ECE9; --muted: #98A6A0;
  --line: #2A3532; --accent: #3CC7A2; --accent-ink: #052019; --accent-soft: #15342B;
  --weak: #F0A43C; --weak-soft: #3A2A12; --danger: #F2867E;
  --fig: #E5ECE9; --fig-far: #5A6762; --ghost: #33403C; --floor: #3B4743;
  --prop: #7E8C87; --prop-fill: #2B3633; --band: #3CC7A2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.top h1 {
  font-size: clamp(30px, 7vw, 44px);
  font-weight: 800;
  font-stretch: 72%;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  line-height: 0.95;
}
.top h1 span { color: var(--accent); }
.phase { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.phase b { color: var(--ink); font-family: var(--f-display); font-stretch: 80%; letter-spacing: 0.02em; }

.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; gap: 4px; margin: 18px -16px 0; padding: 8px 16px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.tabs button {
  flex: 1 1 0; min-width: 0; border: 0; background: transparent; padding: 9px 6px; border-radius: 8px;
  font-family: var(--f-display); font-weight: 700; font-stretch: 85%; font-size: 15px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

section.view { padding-top: 18px; display: flex; flex-direction: column; gap: 22px; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.day {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 4px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; text-align: center;
}
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day.past:not(.today) { background: transparent; }
.dname { font-family: var(--f-display); font-weight: 700; font-stretch: 80%; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
.dnum { font-size: 12px; color: var(--muted); line-height: 1; }
.dplan { font-size: 11px; line-height: 1.15; color: var(--muted); min-height: 26px; display: flex; align-items: center; justify-content: center; hyphens: auto; }
.chips { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; min-height: 26px; align-items: center; }
.chip {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px;
  background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 800; font-size: 13px;
}
.chip.s { background: var(--accent-soft); color: var(--accent); }
.walk {
  width: 30px; height: 26px; border-radius: 7px; border: 1px dashed var(--line); background: transparent;
  display: grid; place-items: center; color: var(--muted); padding: 0;
}
.walk svg { width: 16px; height: 16px; }
.walk[aria-pressed="true"] { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); }
.week-sum { margin: 8px 2px 0; font-size: 14px; color: var(--muted); }

/* Session head */
.head-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.head-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.head-card h2 { font-size: 30px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1; }
.seg { display: inline-flex; background: var(--panel); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 11px; border-radius: 7px; font-size: 14px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button:disabled { cursor: not-allowed; opacity: .55; }
.bar { height: 8px; background: var(--panel); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.prog-txt { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.banner {
  background: var(--accent-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; font-size: 15px;
  display: flex; gap: 10px; align-items: center;
}
.banner svg { flex: none; width: 22px; height: 22px; color: var(--accent); }

/* Blocks */
.block { display: flex; flex-direction: column; gap: 12px; }
.block-head { display: flex; gap: 12px; align-items: baseline; }
.block-no {
  font-family: var(--f-display); font-weight: 800; font-stretch: 70%; font-size: 34px; line-height: 1; color: var(--accent);
  min-width: 22px;
}
.block-head h2 { font-size: 22px; font-weight: 800; font-stretch: 80%; text-transform: uppercase; letter-spacing: 0.02em; }
.block-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

/* Exercise card */
.ex {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px;
  display: grid; grid-template-columns: 1fr; gap: 12px;
}
.ex.complete { border-color: var(--accent); }
@media (min-width: 640px) { .ex { grid-template-columns: 230px minmax(0, 1fr); padding: 14px; gap: 16px; } }
.fig { background: var(--panel); border-radius: 9px; aspect-ratio: 220 / 140; max-width: 100%; position: relative; overflow: hidden; }
.fig svg { display: block; width: 100%; height: 100%; }
.fig[title] { cursor: pointer; }
.fig.paused::after {
  content: 'Zastaveno'; position: absolute; right: 8px; top: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--weak); font-family: var(--f-display); font-stretch: 85%;
}
.figcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cap { margin: 0; font-size: 14px; line-height: 1.3; min-height: 2.6em; display: flex; gap: 8px; align-items: flex-start; }
.cap b {
  flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; margin-top: -1px;
  background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-size: 12px; font-weight: 800;
}
.fig .tag {
  position: absolute; left: 8px; top: 7px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  font-family: var(--f-display); font-weight: 700; font-stretch: 85%;
}
.ex-body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.ex-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.ex-head h3 { font-size: 21px; font-weight: 750; font-stretch: 85%; line-height: 1.15; }
.rx { font-family: var(--f-display); font-weight: 800; font-size: 18px; font-stretch: 85%; color: var(--accent); white-space: nowrap; }
.side { font-size: 13px; color: var(--muted); }
.badge {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink);
}
.cues { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 15px; }
.cues li::marker { color: var(--accent); }
.why { margin: 0; font-size: 15px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.why b { color: var(--accent); }
.mini .mini-why { color: var(--ink); border-top: 1px solid var(--line); padding-top: 6px; }
.err { margin: 0; font-size: 14px; color: var(--muted); }
.err strong { color: var(--danger); font-weight: 700; }
.weak-note { margin: 0; font-size: 14px; color: var(--weak); font-weight: 700; }
.goals { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0; font-size: 13px; color: var(--muted); }
.goal { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--panel); color: var(--ink); }
.goal.weak { background: var(--weak-soft); color: var(--weak); }
.goal-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }
.goal-list b { font-family: var(--f-display); font-stretch: 85%; }
.log { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 2px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pills .lbl { font-size: 13px; color: var(--muted); margin-right: 2px; }
.pill {
  min-width: 40px; height: 40px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface);
  font-family: var(--f-display); font-weight: 800; font-size: 16px; padding: 0 10px;
}
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill.weak { border-color: var(--weak); color: var(--weak); font-size: 13px; font-stretch: 85%; }
.pill.weak[aria-pressed="true"] { background: var(--weak); color: var(--surface); }
.kg { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.kg input {
  width: 72px; height: 40px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface);
  padding: 0 8px; font-family: var(--f-display); font-weight: 700; font-size: 17px; color: var(--ink);
}
.btn {
  height: 40px; border-radius: 99px; border: 1.5px solid var(--ink); background: transparent; padding: 0 14px;
  font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn.run { background: var(--ink); color: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); height: 46px; padding: 0 22px; font-size: 16px; }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.quiet { border-color: var(--line); color: var(--muted); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.up { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--muted); }
.up input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }

/* Circuit */
.timer {
  background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 16px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center;
}
.timer .t-phase, .timer .t-name, .timer .t-next { grid-column: 1; }
.timer .t-phase { font-family: var(--f-display); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; font-size: 13px; opacity: .75; }
.timer .t-name { font-family: var(--f-display); font-weight: 800; font-stretch: 80%; font-size: 24px; line-height: 1.1; }
.timer .t-next { font-size: 14px; opacity: .75; }
.timer .t-clock { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 64px; line-height: 1; grid-column: 2; grid-row: 1 / span 3; }
.timer.rest .t-clock { color: var(--weak); }
.timer.work .t-clock { color: var(--accent); }
.timer .t-ctrl { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.timer .btn { border-color: var(--bg); color: var(--bg); }
.timer .btn.run { background: var(--bg); color: var(--ink); }
.timer .rounds { display: flex; gap: 6px; align-items: center; margin-left: auto; font-size: 13px; }
.timer .pill { height: 34px; min-width: 34px; background: transparent; color: var(--bg); border-color: rgba(255,255,255,.35); }
.timer .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.mini {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.mini.now { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mini h3 { font-size: 16px; font-weight: 750; font-stretch: 85%; line-height: 1.15; }
.mini p { margin: 0; font-size: 13px; color: var(--muted); }
.mini .fig { border-radius: 7px; }

.bonus > summary { list-style: none; cursor: pointer; }
.bonus > summary::-webkit-details-marker { display: none; }
.bonus .tog {
  display: inline-block; vertical-align: middle; margin-left: 6px; padding: 2px 9px; border-radius: 99px; border: 1.5px solid var(--line);
  font-family: var(--f-body); font-size: 12px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--muted);
}
.bonus .tog::before { content: 'Zobrazit'; }
.bonus[open] .tog::before { content: 'Skrýt'; }
.finish { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.finish .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Overview */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.tile b { display: block; font-family: var(--f-display); font-weight: 800; font-stretch: 80%; font-size: 30px; line-height: 1.05; }
.tile span { font-size: 13px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card .txt { margin: 0; font-size: 15px; }
.card h2 { font-size: 20px; font-weight: 800; font-stretch: 80%; text-transform: uppercase; letter-spacing: 0.02em; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
td.r, th.r { text-align: right; }
.cal { max-width: 480px; display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 12px; }
.cal .h { text-align: center; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.cal .wl { color: var(--muted); align-self: center; font-variant-numeric: tabular-nums; }
.cal .c {
  aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--panel); position: relative;
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 13px;
}
.cal .c.A, .cal .c.B { background: var(--accent); color: var(--accent-ink); }
.cal .c.S { background: var(--accent-soft); color: var(--accent); }
.cal .c.fut { background: transparent; border: 1px dashed var(--line); }
.cal .c.td { outline: 2px solid var(--ink); outline-offset: -2px; }
.cal .c i { position: absolute; bottom: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--weak); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.hist { display: flex; flex-direction: column; }
.hrow { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.hrow:last-child { border-bottom: 0; }
.hrow .when { min-width: 92px; font-variant-numeric: tabular-nums; }
.hrow .what { font-weight: 700; flex: 1 1 120px; min-width: 0; }
.hrow .pct { font-variant-numeric: tabular-nums; color: var(--muted); }
.hrow .btn { height: 32px; font-size: 13px; padding: 0 10px; }
.empty { color: var(--muted); font-size: 15px; margin: 0; }

/* Weak leg */
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.steps li::marker { font-family: var(--f-display); font-weight: 800; color: var(--accent); }
.choice { display: flex; gap: 8px; flex-wrap: wrap; }
.choice button { flex: 1 1 120px; height: 52px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 16px; }
.choice button[aria-pressed="true"] { border-color: var(--weak); background: var(--weak-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--weak); }
.two { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 640px) { .two { grid-template-columns: 260px minmax(0, 1fr); } }
.list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

footer.store { margin-top: 28px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
footer.store i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
footer.store.db i { background: var(--accent); }
footer.store { flex-wrap: wrap; }
footer.store .link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
textarea.bk {
  width: 100%; border: 1.5px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink);
  padding: 8px 10px; font: 13px/1.4 ui-monospace, monospace; resize: vertical;
}

@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap" lang="cs">
  <header class="top">
    <div>
      <h1>Rovně <span>a</span> silně</h1>
      <p class="phase" id="phase"></p>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sekce">
    <button role="tab" id="tab-today" data-tab="today" aria-selected="true" aria-controls="v-today">Dnes</button>
    <button role="tab" id="tab-log" data-tab="log" aria-selected="false" aria-controls="v-log">Přehled</button>
    <button role="tab" id="tab-weak" data-tab="weak" aria-selected="false" aria-controls="v-weak">Slabší noha</button>
  </nav>
  <section class="view" id="v-today" role="tabpanel" aria-labelledby="tab-today"></section>
  <section class="view" id="v-log" role="tabpanel" aria-labelledby="tab-log" hidden></section>
  <section class="view" id="v-weak" role="tabpanel" aria-labelledby="tab-weak" hidden></section>
  <footer class="store" id="store"><i></i><span>Záznamy se ukládají v tomto prohlížeči.</span></footer>
</div>

<script>
(() => {
'use strict';

const rad = a => a * Math.PI / 180;
const dirv = a => [Math.sin(rad(a)), Math.cos(rad(a))];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];

function ik(A, C, a, b, s) {
  const dx = C[0] - A[0], dy = C[1] - A[1];
  const d0 = Math.hypot(dx, dy) || 0.001;
  const ux = dx / d0, uy = dy / d0;
  const d = Math.min(Math.max(d0, Math.abs(a - b) + 0.5), a + b - 0.01);
  const al = Math.acos(Math.max(-1, Math.min(1, (a * a + d * d - b * b) / (2 * a * d))));
  const th = -s * al;
  const rx = ux * Math.cos(th) - uy * Math.sin(th), ry = ux * Math.sin(th) + uy * Math.cos(th);
  const B = [A[0] + a * rx, A[1] + a * ry];
  const ex = C[0] - B[0], ey = C[1] - B[1], e = Math.hypot(ex, ey) || 1;
  return [B, [B[0] + b * ex / e, B[1] + b * ey / e]];
}

function lerp(a, b, t) {
  if (typeof a === 'number' && typeof b === 'number') return a + (b - a) * t;
  if (Array.isArray(a) && Array.isArray(b)) return a.map((v, i) => v + (b[i] - v) * t);
  if (a && b && typeof a === 'object') { const o = {}; for (const k in a) o[k] = lerp(a[k], b[k], t); return o; }

}

  const hd = dirv(p.t + p.h);
  const head = add([neck[0] + 11 * hd[0], neck[1] + 11 * hd[1]], p.hx);
  const hipN = add(p.hip, p.ho), hipF = sub(p.hip, p.ho);
  const shN = add(neck, p.so), shF = sub(neck, p.so);

  const up = e.kg ? `<label class="up"><input type="checkbox" id="up-${id}" data-up="${id}"> Šlo to ve všech sériích o 2 opakování víc. Příště přidej váhu.</label>` : '';
  const badge = last && last.up ? '<span class="badge">Přidej váhu</span>' : '';
  return `<article class="ex" id="ex-${id}">
    <div class="figcol"><div class="fig" data-fig="${e.fig || id}" role="img" aria-label="Animace cviku ${esc(e.name)}"></div></div>
    <div class="ex-body">
      <div class="ex-head"><h3>${e.name}</h3><span class="rx">${e.rx}</span>${e.side ? `<span class="side">${e.side}</span>` : ''}${badge}</div>
      ${EX_GOALS[id] ? `<p class="goals">Zlepšuje: ${EX_GOALS[id].map(g => `<span class="goal${GOALS[g].weak ? ' weak' : ''}">${GOALS[g].name}</span>`).join('')}</p>` : ''}
      <p class="why"><b>K čemu:</b> ${e.why}</p>
      <ul class="cues">${e.cues.map(c => `<li>${c}</li>`).join('')}</ul>
      <p class="err"><strong>Pozor:</strong> ${e.err}</p>
      ${sideNote}
      <div class="log"><div class="pills">${pills}</div>${kg}${hold}</div>
      ${up}
    </div>
  </article>`;
}

let finishConfirm = false;
function renderToday() {
  ensureCur();
  stopCircuit(true);
  const v = document.getElementById('v-today');
  const td = today();
  const doneToday = state.sessions.filter(s => s.d === td && s.done);
  const banner = doneToday.length ? `<div class="banner">${ICON_OK}<span>Dnes hotovo: ${doneToday.map(s => `${TYPE_NAME[s.type]} (${prog(s).pct} %)`).join(', ')}. Další na řadě je ${TYPE_NAME[nextType()]}.</span></div>` : '';
  const locked = hasProgress(cur);
  const seg = ['A', 'B', 'S'].map(t => `<button data-act="type" data-type="${t}" aria-pressed="${cur.type === t}" ${locked && cur.type !== t ? 'disabled' : ''}>${t === 'S' ? 'Stabilizace' : t}</button>`).join('');
  let html = weekStripHTML() + banner + `
    <section class="head-card">
      <div class="head-row"><h2 id="sess-title">${TYPE_NAME[cur.type]}</h2><div class="seg" role="group" aria-label="Typ tréninku">${seg}</div></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="prog-txt"><span id="prog-txt"></span><span>${cur.type === 'S' ? (cur.neck ? 'asi 17 min' : 'asi 10 min') : cur.opt ? `asi 45 min, s okruhem +${(cur.rt || roundsTarget()) * 5} min` : (cur.neck ? 'asi 55 min' : 'asi 45–50 min')}</span></div>
      <p class="note">${locked ? 'Typ tréninku se dá změnit jen před první odškrtnutou sérií.' : `Navrženo podle posledního tréninku. ${cur.type === 'S' ? 'Krátká verze na dny s chůzí.' : 'Odškrtávej série, jak je děláš.'}`}</p>
    </section>`;
  let no = 1;
  const list = exList(cur);
  const stabIds = list.filter(id => STAB_ALL.includes(id));
  const mainIds = list.filter(id => !STAB_ALL.includes(id) && !PLAN.neck.includes(id));
  html += blockHTML(no++, 'Stabilizace', 'Na začátku každého tréninku, asi 10 min. Hlavní práce na vyosení, nepřeskakuj ji.', stabIds);
  if (cur.neck) html += blockHTML(no++, 'Krk', 'Asi 7 min, na napřímenou krční páteř. Pomalu a bez bolesti. Při brnění rukou nebo závrati přestaň.', PLAN.neck);
  if (cur.type !== 'S') {
    html += blockHTML(no++, cur.type === 'A' ? 'Silová část A' : 'Silová část B', '3 série, mezi sériemi 60–90 s pauza. Váhu vol tak, aby poslední 2 opakování byla těžká, ale čistá.', mainIds);
    html += circuitHTML();

  html += `<section class="finish" id="finish"></section>`;

function updateToday() {
  const v = document.getElementById('v-today');
  const p = prog(cur);
  const bar = document.getElementById('bar');
  if (bar) bar.style.width = p.pct + '%';
  const pt = document.getElementById('prog-txt');
  if (pt) pt.textContent = `${p.done} z ${p.total} ${cur.opt || cur.type === 'S' ? 'sérií' : 'sérií a kol'} · ${p.pct} %`;
  for (const id of exList(cur)) {
    const n = cur.sets[id] || 0;
    const card = document.getElementById('ex-' + id);
    if (!card) continue;
    card.querySelectorAll('[data-act="set"]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i < n)));
    const ex = card.querySelector('[data-act="extra"]');
    if (ex) ex.setAttribute('aria-pressed', String(!!cur.extra[id]));
    const upEl = card.querySelector('[data-up]');
    if (upEl) upEl.checked = !!cur.up[id];
    const e = EX[id];
    const full = n >= e.sets && (!(state.settings.weak && e.weak) || cur.extra[id]);
    card.classList.toggle('complete', full);
  }
  v.querySelectorAll('[data-act="round"]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i < (cur.rounds || 0))));
  const f = document.getElementById('finish');
  if (f) {
    if (finishConfirm) {
      f.innerHTML = `<p class="note">Zahodit dnešní záznam ${TYPE_NAME[cur.type]}? Odškrtnuté série se smažou.</p>
        <div class="row"><button class="btn danger" data-act="discard-yes">Zahodit</button><button class="btn quiet" data-act="discard-no">Ponechat</button></div>`;
    } else {
      f.innerHTML = `<p class="note">${p.done ? `Máš hotovo ${p.pct} %. Dokončený trénink se uloží do přehledu a příště se nabídne ${cur.type === 'S' ? TYPE_NAME[nextType()] : TYPE_NAME[cur.type === 'A' ? 'B' : 'A']}.` : 'Až odškrtneš první sérii, trénink se začne ukládat.'}</p>
        <div class="row"><button class="btn primary" data-act="finish" ${p.done ? '' : 'disabled'}>Dokončit trénink</button>${hasProgress(cur) ? '<button class="btn quiet" data-act="discard">Zahodit záznam</button>' : ''}</div>`;
    }
  }
}

/* ---- hold countdown ---- */
// Seconds to get into position before a hold or the circuit starts counting.
const PREP = 3;
let holdT = null;
function startHold(btn) {
  if (holdT) { clearInterval(holdT.iv); holdT.btn.textContent = `Odpočet ${holdT.sec} s`; holdT.btn.classList.remove('run'); const same = holdT.btn === btn; holdT = null; if (same) return; }
  const sec = +btn.dataset.sec, start = Date.now() + PREP * 1000, end = start + sec * 1000;
  let lastPrep = -1, started = false;
  btn.classList.add('run');
  const tick = () => {
    const now = Date.now();
    if (now < start) {
      const p = Math.ceil((start - now) / 1000);
      btn.textContent = `Připrav se… ${p}`;
      if (p !== lastPrep) { lastPrep = p; beep(520, 0.08, 0.1); }
      return;
    }
    if (!started) { started = true; beep(880, 0.3); }
    const left = Math.max(0, Math.ceil((end - now) / 1000));
    btn.textContent = `Zbývá 0:${pad(left)}`;
    if (left <= 0) {
      clearInterval(holdT.iv); beep(880, 0.5, 0.2);
      btn.textContent = 'Hotovo, další strana'; btn.classList.remove('run');
      const b = btn; setTimeout(() => { if (b.isConnected && !b.classList.contains('run')) b.textContent = `Odpočet ${sec} s`; }, 4000);
      holdT = null;
    }
  };
  holdT = { btn, sec, iv: setInterval(tick, 200) };
  tick();
}

/* ---- circuit timer ---- */
// prepEnd: while set, the timer is in the get-ready countdown before (re)starting the current phase.
const CT = { running: false, phase: 'work', idx: 0, round: 0, left: WORK, endAt: 0, prepEnd: 0, iv: null, lastBeep: -1 };
function ctPaint() {
  const tm = document.getElementById('timer');
  if (!tm) return;
  const rt = cur.rt || roundsTarget();
  const e = EX[PLAN.circ[CT.idx]];
  const prep = CT.running && CT.prepEnd ? Math.max(1, Math.ceil((CT.prepEnd - Date.now()) / 1000)) : 0;
  const sec = prep || Math.max(0, Math.ceil(CT.left));
  tm.className = 'timer' + (prep ? ' rest' : CT.running || CT.started ? (CT.phase === 'work' ? ' work' : ' rest') : '');
  document.getElementById('t-clock').textContent = Math.floor(sec / 60) + ':' + pad(sec % 60);
  if (prep) {
    document.getElementById('t-phase').textContent = 'Připrav se';
    document.getElementById('t-name').textContent = (CT.phase === 'work' ? '' : 'Další: ') + e.name;
    document.getElementById('t-next').textContent = `Kolo ${CT.round + 1} z ${rt} · cvik ${CT.idx + 1} z 5`;
  } else if (CT.finished) {
    document.getElementById('t-phase').textContent = 'Hotovo';
    document.getElementById('t-name').textContent = 'Okruh dokončen';
    document.getElementById('t-next').textContent = `${rt} kola za tebou. Dokonči trénink dole.`;
  } else if (CT.phase === 'work') {
    document.getElementById('t-phase').textContent = CT.started ? (CT.running ? 'Cvič' : 'Pauza (zastaveno)') : 'Připraveno';
    document.getElementById('t-name').textContent = e.name;
    document.getElementById('t-next').textContent = `Kolo ${CT.round + 1} z ${rt} · cvik ${CT.idx + 1} z 5`;
  } else {
    document.getElementById('t-phase').textContent = CT.running ? 'Odpočinek' : 'Pauza (zastaveno)';
    document.getElementById('t-name').textContent = 'Další: ' + EX[PLAN.circ[CT.idx]].name;
    document.getElementById('t-next').textContent = `Kolo ${CT.round + 1} z ${rt}`;
  }
  const sb = document.getElementById('c-start');
  if (sb) sb.textContent = CT.finished ? 'Znovu' : CT.running ? 'Zastavit' : CT.started ? 'Pokračovat' : 'Spustit okruh';
  document.querySelectorAll('.mini').forEach((m, i) => m.classList.toggle('now', CT.started && !CT.finished && i === CT.idx));
}
function ctTick() {
  if (CT.prepEnd) {
    const p = Math.ceil((CT.prepEnd - Date.now()) / 1000);
    if (p > 0) {
      if (p !== CT.lastBeep) { CT.lastBeep = p; beep(520, 0.08, 0.1); }
      ctPaint(); return;
    }
    CT.prepEnd = 0; CT.lastBeep = -1;
    CT.endAt = Date.now() + CT.left * 1000;
    beep(880, 0.35);
  }
  CT.left = (CT.endAt - Date.now()) / 1000;
  const s = Math.ceil(CT.left);
  if (s <= 3 && s >= 1 && s !== CT.lastBeep) { CT.lastBeep = s; beep(520, 0.08, 0.1); }
  if (CT.left <= 0) {
    const rt = cur.rt || roundsTarget();
    if (CT.phase === 'work') {
      const lastOne = CT.idx === 4 && CT.round === rt - 1;
      if (lastOne) {
        CT.round++; finishRound(CT.round);
        CT.running = false; CT.finished = true; CT.left = 0; clearInterval(CT.iv); keepAwake(false);
        beep(880, 0.6, 0.2); ctPaint(); return;
      }
      CT.phase = 'rest'; CT.left = REST;
      if (CT.idx === 4) { CT.idx = 0; CT.round++; finishRound(CT.round); } else CT.idx++;
      beep(440, 0.35);
    } else {
      CT.phase = 'work'; CT.left = WORK; beep(880, 0.35);
    }
    CT.endAt = Date.now() + CT.left * 1000; CT.lastBeep = -1;
  }
  ctPaint();
}
function finishRound(n) {
  if ((cur.rounds || 0) < n) { cur.rounds = n; touch(); updateToday(); }
}
function startCircuit() {
  if (CT.finished) resetCircuit();
  if (CT.running) { stopCircuit(); ctPaint(); return; }
  CT.running = true; CT.started = true;
  CT.prepEnd = Date.now() + PREP * 1000; CT.lastBeep = -1;
  clearInterval(CT.iv); CT.iv = setInterval(ctTick, 200);
  keepAwake(true);
  ctTick();
}
function stopCircuit(silent) {
  if (CT.running && !CT.prepEnd) { CT.left = Math.max(0, (CT.endAt - Date.now()) / 1000); }
  CT.running = false; CT.prepEnd = 0; clearInterval(CT.iv); keepAwake(false);
  if (silent) resetCircuit(true);
}
function resetCircuit(noPaint) {
  clearInterval(CT.iv);
  Object.assign(CT, { running: false, started: false, finished: false, phase: 'work', idx: 0, round: 0, left: WORK, prepEnd: 0, lastBeep: -1 });
  keepAwake(false);
  if (!noPaint) ctPaint();
}

/* ---- events ---- */
const vToday = document.getElementById('v-today');
vToday.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.ex;
  if (act === 'set') {
    const i = +b.dataset.i, n = cur.sets[id] || 0;
    cur.sets[id] = n === i + 1 ? i : i + 1;
    touch(); updateToday(); refreshTypeLock();
  } else if (act === 'extra') {
    cur.extra[id] = !cur.extra[id]; touch(); updateToday(); refreshTypeLock();
  } else if (act === 'round') {
    const i = +b.dataset.i, n = cur.rounds || 0;
    cur.rounds = n === i + 1 ? i : i + 1; touch(); updateToday(); refreshTypeLock();
  } else if (act === 'type') {
    if (hasProgress(cur)) return;
    cur.type = b.dataset.type; renderToday();
  } else if (act === 'walk') {
    const d = b.dataset.d;
    if (state.walks[d]) delete state.walks[d]; else state.walks[d] = true;
    save();
    const strip = vToday.querySelector('.week').parentElement;
    strip.outerHTML = weekStripHTML();
    renderLog();
  } else if (act === 'hold') {
    startHold(b);
  } else if (act === 'c-start') {
    startCircuit();
  } else if (act === 'c-reset') {
    resetCircuit();
  } else if (act === 'finish') {
    for (const ex of exList(cur)) if (EX[ex].kg && (cur.sets[ex] || 0) > 0 && cur.w[ex] == null) { const l = lastInfo(ex); if (l) cur.w[ex] = l.kg; }
    cur.done = true; touch();
    cur = null; finishConfirm = false;
    renderAll();
    window.scrollTo({ top: 0, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
  } else if (act === 'discard') {
    finishConfirm = true; updateToday();
  } else if (act === 'discard-no') {
    finishConfirm = false; updateToday();
  } else if (act === 'discard-yes') {
    state.sessions = state.sessions.filter(s => s !== cur);
    const t = cur.type; cur = newDraft(t); finishConfirm = false; save();
    if (!state.sessions.length) state.settings.start = null;
    renderAll();
  }
});
function refreshTypeLock() {
  const locked = hasProgress(cur);
  vToday.querySelectorAll('[data-act="type"]').forEach(b => { b.disabled = locked && b.dataset.type !== cur.type; });
}
vToday.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.kg) {
    const id = t.dataset.kg, v = parseFloat(String(t.value).replace(',', '.'));
    if (isNaN(v) || v < 0) delete cur.w[id]; else cur.w[id] = Math.round(v * 10) / 10;
    touch(); updateToday(); refreshTypeLock();
  } else if (t.dataset.up) {
    cur.up[t.dataset.up] = t.checked; if (!t.checked) delete cur.up[t.dataset.up];
    touch(); updateToday(); refreshTypeLock();
  }
});

/* ================= Overview ================= */
let delConfirm = null;
function renderLog() {
  const v = document.getElementById('v-log');
  const td = today(), mon = mondayOf(td);
  const done = state.sessions.filter(s => s.done);
  const thisWeek = done.filter(s => s.d >= mon && s.type !== 'S').length;
  let walksWeek = 0; for (let i = 0; i < 7; i++) if (state.walks[addDays(mon, i)]) walksWeek++;
  const tiles = `<div class="tiles">
    <div class="tile"><b class="num">${weekNo()}.</b><span>týden programu</span></div>
    <div class="tile"><b class="num">${thisWeek}/3</b><span>tréninky tento týden</span></div>
    <div class="tile"><b class="num">${walksWeek}/7</b><span>dny s chůzí tento týden</span></div>
    <div class="tile"><b class="num">${done.length}</b><span>dokončených tréninků celkem</span></div>
  </div>`;

  let cal = '<div class="cal"><span></span>' + DN.map(d => `<span class="h">${d}</span>`).join('');
  for (let w = 7; w >= 0; w--) {
    const m = addDays(mon, -7 * w);
    cal += `<span class="wl">${fmtShort(m)}</span>`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(m, i);
      const ss = done.filter(s => s.d === d);
      const main = ss.find(s => s.type !== 'S') || ss[0];
      const cls = ['c', main ? main.type : '', d > td ? 'fut' : '', d === td ? 'td' : ''].filter(Boolean).join(' ');
      const label = ss.map(s => s.type).join('');
      cal += `<span class="${cls}" title="${fmtDay(d)}${ss.length ? ': ' + ss.map(s => TYPE_NAME[s.type]).join(', ') : ''}${state.walks[d] ? ', chůze' : ''}">${label}${state.walks[d] ? '<i></i>' : ''}</span>`;
    }
  }
  cal += '</div>';

  const weighted = Object.keys(EX).filter(id => EX[id].kg && !EX[id].retired);
  const wRows = weighted.map(id => {
    const l = lastInfo(id);
    return `<tr><td>${EX[id].name}</td><td class="r num">${l ? fmtKg(l.kg) + ' kg' : '–'}</td><td class="num">${l ? fmtShort(l.d) : ''}</td><td>${l && l.up ? '<span class="badge">Přidej váhu</span>' : ''}</td></tr>`;
  }).join('');

  const list = [...state.sessions].sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : (b.u || 0) - (a.u || 0)).slice(0, 30);
  const rows = list.length ? list.map(s => {
    const p = prog(s);
    const conf = delConfirm === s.id;
    return `<div class="hrow"><span class="when">${fmtDay(s.d)}</span><span class="what">${TYPE_NAME[s.type]}${s.opt && s.rounds ? ' + okruh' : ''}${s.done ? '' : ' · rozdělaný'}</span><span class="pct">${p.pct} %</span>
      ${conf ? `<button class="btn danger" data-del-yes="${s.id}">Smazat</button><button class="btn quiet" data-del-no="1">Zpět</button>` : `<button class="btn quiet" data-del="${s.id}" aria-label="Smazat záznam ${fmtDay(s.d)}">Smazat</button>`}</div>`;
  }).join('') : '<p class="empty">Zatím tu nic není. Jakmile v záložce Dnes odškrtneš první sérii, trénink se tu objeví.</p>';

  const goals = `<section class="card"><h2>Co plánem zlepšujeme</h2>
      <ul class="goal-list">${Object.values(GOALS).map(g => `<li><span class="goal${g.weak ? ' weak' : ''}">${g.name}</span> ${g.what} <span class="note">Kde: ${g.where}.</span></li>`).join('')}</ul>
      <p class="note">U každého cviku v záložce Dnes je napsané, který z cílů zlepšuje.</p>
    </section>`;
  const neck = `<section class="card"><h2>Napřímená krční páteř</h2>
      <p class="txt">Zdravý krk je při pohledu z boku mírně prohnutý dopředu (lordóza). Když je napřímený, hlava často ujíždí dopředu a šíjové svaly jsou přetížené a zároveň slabé. Blok Krk proto posiluje hluboké ohybače krku (zásun brady) a šíjové svaly (tlak do dlaní, zvedání hlavy). Právě takové cviky ve studiích zakřivení zlepšovaly, výsledek se ale ukázal až po 3 měsících pravidelného cvičení.</p>
      <p class="txt">Napřímený krk často vůbec nebolí a tvar na rentgenu sám o bolesti moc neříká. Když ti ho našel lékař, ukaž mu tyhle cviky, ať je případně upraví.</p>
      <p class="txt"><b>K lékaři nebo fyzioterapeutovi hned, když:</b></p>
      <ul class="list">
        <li>bolest, brnění nebo slabost vystřelují do ramene či ruky,</li>
        <li>se ti při cvičení točí hlava, rozmazává vidění nebo přijde silná bolest hlavy,</li>
        <li>krk začal bolet po úrazu (pád, autonehoda),</li>
        <li>se bolest po 2 týdnech cvičení zhoršuje.</li>
      </ul>
    </section>`;
  v.innerHTML = tiles + goals + neck + `
    <section class="card"><h2>Posledních 8 týdnů</h2>
      <div class="scroll">${cal}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Trénink A nebo B</span><span><i style="background:var(--accent-soft)"></i>Stabilizace a krk</span><span><i style="background:var(--weak);border-radius:50%"></i>Chůze</span></div>
    </section>
    <section class="card"><h2>Rozvrh týdne</h2>
      <div class="scroll"><table><thead><tr><th>Den</th><th>Plán</th></tr></thead><tbody>
        <tr><td>Pondělí</td><td>Trénink (A a B se střídají)</td></tr>
        <tr><td>Úterý</td><td>Chůze</td></tr>
        <tr><td>Středa</td><td>Trénink</td></tr>
        <tr><td>Čtvrtek</td><td>Chůze a krátká stabilizace</td></tr>
        <tr><td>Pátek</td><td>Trénink</td></tr>
        <tr><td>Sobota</td><td>Chůze</td></tr>
        <tr><td>Neděle</td><td>Volno</td></tr>
      </tbody></table></div>
      <p class="note">Dny si klidně posuň, jen mezi silovými tréninky nech aspoň den pauzu. Cíl pro chůzi: 8–10 tisíc kroků denně.</p>
    </section>
    <section class="card"><h2>Aktuální váhy</h2>
      <div class="scroll"><table><thead><tr><th>Cvik</th><th class="r">Naposledy</th><th>Kdy</th><th></th></tr></thead><tbody>${wRows}</tbody></table></div>
      <p class="note">Jakmile zvládneš všechny série o 2 opakování víc, přidej váhu a vrať se na původní počet opakování.</p>
    </section>
    <section class="card"><h2>Historie</h2><div class="hist">${rows}</div></section>` + backupHTML();
}

/* ---- backup: copy all records as text between devices ---- */
let backup = null, backupMsg = '';
function backupHTML() {
  const body = backup === 'export'
    ? `<textarea class="bk" id="bk-out" readonly rows="5" aria-label="Záloha záznamů">${esc(JSON.stringify(state))}</textarea>
      <div class="row"><button class="btn" data-bk="copy">Kopírovat</button>${APP ? '<button class="btn" data-bk="share">Sdílet</button>' : ''}<button class="btn quiet" data-bk="close">Zavřít</button></div>`
    : backup === 'import'
    ? `<textarea class="bk" id="bk-in" rows="5" placeholder="Sem vlož zkopírovanou zálohu" aria-label="Vložit zálohu"></textarea>
      <div class="row"><button class="btn" data-bk="load">Načíst zálohu</button><button class="btn quiet" data-bk="close">Zavřít</button></div>`
    : '<div class="row"><button class="btn" data-bk="export">Exportovat</button><button class="btn" data-bk="import">Importovat</button></div>';
  return `<section class="card"><h2>Záloha záznamů</h2>
      <p class="note">Přenese tréninky, váhy a chůzi mezi telefonem, počítačem a verzí na claude.ai. Na jednom zařízení dej Exportovat a zkopírovaný text vlož na druhém přes Importovat. Nic se nesmaže, záznamy se spojí.</p>
      ${body}${backupMsg ? `<p class="note" role="status">${backupMsg}</p>` : ''}
    </section>`;
}
function backupAction(act) {
  backupMsg = '';
  if (act === 'export' || act === 'import') backup = act;
  else if (act === 'close') backup = null;
  else if (act === 'copy') {
    const ta = document.getElementById('bk-out');
    ta.select();
    const done = () => { backupMsg = 'Zkopírováno. Teď to vlož na druhém zařízení přes Importovat.'; renderLog(); };
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) {} });
    else { try { document.execCommand('copy'); done(); } catch (e) {} }
    return;
  } else if (act === 'share') {
    try { APP.share(JSON.stringify(state)); } catch (e) {}
    return;
  } else if (act === 'load') {
    let o = null;
    try { o = JSON.parse(document.getElementById('bk-in').value.trim()); } catch (e) {}
    if (!o || o.v !== 1 || !Array.isArray(o.sessions)) { backupMsg = 'Tohle nevypadá jako záloha z této aplikace. Zkopíruj celý text z Exportovat.'; renderLog(); return; }
    const before = state.sessions.length;
    state = merge(o, state);
    save(); cur = null; backup = null;
    backupMsg = `Hotovo. Nových tréninků: ${state.sessions.length - before}.`;
    renderAll();
    return;
  }
  renderLog();
}
document.getElementById('v-log').addEventListener('click', ev => {
  const t = ev.target.closest('button');
  if (!t) return;
  if (t.dataset.bk) { backupAction(t.dataset.bk); return; }
  if (t.dataset.del) { delConfirm = t.dataset.del; renderLog(); }
  else if (t.dataset.delNo) { delConfirm = null; renderLog(); }
  else if (t.dataset.delYes) {
    const id = t.dataset.delYes;
    state.sessions = state.sessions.filter(s => s.id !== id);
    if (cur && cur.id === id) cur = null;
    if (!state.sessions.length) state.settings.start = null;
    delConfirm = null; save(); renderAll();
  }
});

/* ================= Weak leg ================= */
function renderWeak() {
  const v = document.getElementById('v-weak');
  const w = state.settings.weak;
  v.innerHTML = `
    <section class="card">
      <h2>Která noha je slabší?</h2>
      <div class="two">
        <div class="fig" data-fig="stoj1" role="img" aria-label="Animace stoje na jedné noze zepředu, pánev zůstává ve vodorovné linii"></div>
        <ol class="steps">
          <li>Postav se naboso před zrcadlo, ruce v bok.</li>
          <li>Zvedni jednu nohu a vydrž 30 s. Sleduj, jestli se pánev drží na čárkované linii, nebo se boky přesouvají do strany.</li>
          <li>Na stejné noze udělej 5 pomalých podřepů. Hlídej, jestli koleno neuhýbá dovnitř.</li>
          <li>Totéž zopakuj na druhé noze.</li>
          <li>Slabší je noha, na které se víc vyosuješ do strany, víc se třeseš nebo ti uhýbá koleno.</li>
        </ol>
      </div>
    </section>
    <section class="card">
      <h2>Tvoje slabší noha</h2>
      <div class="choice" role="group" aria-label="Slabší noha">
        <button data-weak="" aria-pressed="${!w}">Zatím nevím</button>
        <button data-weak="L" aria-pressed="${w === 'L'}">Levá</button>
        <button data-weak="R" aria-pressed="${w === 'R'}">Pravá</button>
      </div>
      <p class="note">${w ? `Nastaveno: <b>${w === 'L' ? 'levá' : 'pravá'}</b>. U cviků na jednu nohu začínáš touto stranou a přibyla jí jedna série navíc (oranžové tlačítko „+1 slabší“).` : 'Dokud nevíš, cvič obě strany stejně a začínej levou. Až to zjistíš, vyber stranu a plán přidá slabší noze sérii navíc.'}</p>
    </section>
    <section class="card">
      <h2>Kdy zajít k fyzioterapeutovi</h2>
      <ul class="list">
        <li>Když tě něco bolí (koleno, kyčel, záda, kotník).</li>
        <li>Když jsi na té noze dřív měl úraz, třeba podvrtnutý kotník.</li>
        <li>Když se rovnováha ani po 6–8 týdnech nezlepší.</li>
        <li>Když máš podezření na rozdílnou délku nohou nebo problém s chodidlem.</li>
      </ul>
    </section>`;
  mountAll(v);
}
document.getElementById('v-weak').addEventListener('click', ev => {
  const b = ev.target.closest('[data-weak]');
  if (!b) return;
  state.settings.weak = b.dataset.weak || null;
  save(); renderAll();
});

/* ================= Tabs ================= */
const TABS = ['today', 'log', 'weak'];
function showTab(t) {
  for (const k of TABS) {
    document.getElementById('v-' + k).hidden = k !== t;
    document.getElementById('tab-' + k).setAttribute('aria-selected', String(k === t));
  }
  try { localStorage.setItem(LS_KEY + '-tab', t); } catch (e) {}
}
document.querySelector('.tabs').addEventListener('click', ev => {
  const b = ev.target.closest('[data-tab]');
  if (b) { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }
});

function renderAll() { renderHeader(); renderToday(); renderLog(); renderWeak(); }

let startTab = 'today';
try { const t = localStorage.getItem(LS_KEY + '-tab'); if (TABS.includes(t)) startTab = t; } catch (e) {}
const hashTab = (location.hash || '').slice(1);
if (TABS.includes(hashTab)) startTab = hashTab;
renderAll();
showTab(startTab);
connect();
if (APP) {
  setMode('local');
  const v = document.createElement('span');
  v.innerHTML = `· Verze ${esc(APP.version())} · <button class="link" id="upd">Zkontrolovat aktualizace</button>`;
  document.getElementById('store').appendChild(v);
  document.getElementById('upd').addEventListener('click', () => APP.checkUpdate());
}

// Refresh "today" when the date rolls over while the page stays open.
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!CT.running) { cur = null; renderAll(); } } }, 60000);
})();
</script>
